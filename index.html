<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chairman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Jersey+10&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --room:#12110f;
  --panel:#1a1917;
  --line:#2e2b26;
  --text:#efe7d6;
  --muted:#9a9282;
  --amber:#ffb530;
  --club:#c8281e;
  --display:"Jersey 10","Arial Narrow",Impact,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  /* U0 (2026-10-28): gövde yazısı orantılı; tablo ve sayı sütunları --mono, büyük başlık ve büyük sayılar --display */
  --govde:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--room);color:var(--text)}
body{font-family:var(--govde);font-size:14px;line-height:1.55;padding-inline:16px;padding-block:18px 48px}
/* oyun alanı pencereye sığan en büyük 4:3 kare (2026-10-03 ikinci paket, kullanıcı kararı; eskiden en çok 900 px): altındaki düğme satırı
   ve geliştirici alanı ekranda kalır; dar ya da alçak pencerede en az 640 px (yer yoksa pencere genişliği) */
.wrap{margin-inline:auto;display:grid;gap:18px}
.screen{position:relative;width:min(100%,max(640px,calc((100svh - 190px)*4/3)));margin-inline:auto;aspect-ratio:4/3;overflow:hidden;background:#000;box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 1px #2e2b26}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
/* 3B görüntü tam sayı katında çizilir (js/goruntu.js); tarayıcı ekrana yumuşak küçültür: pikseller eşit görünür (keskin-çift doğrusal) */
.screen canvas#view{image-rendering:auto}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 22px}
.grp{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
/* U1: izleme hızının “önemli an” eki — yeri hep ayrılır (satır kaymasın), yalnız önemli anda görünür */
.izAn{color:var(--amber);visibility:hidden}
.izAn.acik{visibility:visible}
.seg{display:flex;flex-wrap:wrap;gap:4px}
/* F2: geçici test düğmesi şeritte (kesikli çerçeve, TEST etiketi; bültendeki "Beklemeden geç" kalıbı); yayından önce kaldırılır */
.controls button.test-dugme{color:var(--muted);background:transparent;border:1px dashed #5a5446;border-bottom-width:1px;box-shadow:none;font-weight:400}
.controls button.test-dugme small{font-size:max(var(--k-enKucuk,12px),.8em);font-weight:600;letter-spacing:.1em;margin-right:.3em;color:var(--amber)}
.controls button.test-dugme:hover:not(:disabled){color:var(--text);border-color:var(--text)}
.controls button.test-dugme:disabled{cursor:progress;color:var(--text);font-variant-numeric:tabular-nums}
button{font:inherit;font-size:12.5px;color:var(--text);background:#23211e;border:1px solid #3b372f;border-bottom-width:3px;border-radius:4px;padding:6px 11px 5px;cursor:pointer;line-height:1.2}
button:hover{border-color:#5a5446}
button[aria-pressed="true"]{color:#1a1203;background:var(--amber);border-color:#b9791a}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
/* U5: maçın başkan şeridi odadaki kâğıt düğme dilinde (krem kâğıt, mürekkep yazı, kalın alt kenar; seçili amber; TEST kesikli; basınca iner).
   Renkler STIL.kagit'in değerleri (sayfa CSS'i STIL'den önce gelir) */
.controls button{color:#26221c;background:#f4eedf;border-color:#c9b994;border-bottom-color:#a99a74;font-weight:600;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.controls button:hover:not(:disabled){border-color:#a5620a}
.controls button[aria-pressed="true"]{color:#1a1203;background:#ffb530;border-color:#a5620a}
.controls button:disabled{opacity:.55;cursor:default}
.controls button:not(:disabled):active{transform:translateY(1px);box-shadow:none}
/* geliştirici alanı: yalnız deneme ayarları; kapalı başlar, oyuncu alanının parçası değildir */
.gelistirici{width:min(100%,max(640px,calc((100svh - 190px)*4/3)));margin-inline:auto;border:1px dashed var(--line);border-radius:6px;padding:6px 12px;color:var(--muted);font-size:12px}
.gelistirici summary{cursor:pointer;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.gelistirici[open]{display:grid;gap:10px;padding-bottom:12px}
.gelistirici .satir{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:flex-end}
.gelistirici label{display:flex;flex-direction:column;gap:4px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.gelistirici input[type=range]{width:180px;accent-color:var(--amber)}
.gelistirici output{color:var(--text);font-variant-numeric:tabular-nums}
.gelistirici .bilgi{margin:0;color:var(--muted);font-size:12px}
.gelistirici select{font:inherit;font-size:12px;letter-spacing:0;text-transform:none;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
.nogl{position:absolute;inset:0;display:grid;place-items:center;margin:0;padding:24px;text-align:center;color:var(--muted)}
[hidden]{display:none!important}
/* ---- ortak .oe- bileşenleri: maç programı (js/ekran-mac-oncesi.js, açık tonlar, STIL.program.renk) ---- */
.screen{container-type:inline-size}
/* maç programı (2.8E): stat arkada donuk ve hafif karartılmış; önde kâğıt kitapçık. Ölçüler karenin genişliğiyle orantılı (cqw) */
.onEkran{position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding:2.2% 2.6%;overflow:hidden;
  font-family:var(--govde);font-size:var(--k-yaziBoyu,max(14px,1.5cqw));line-height:1.3;font-variant-numeric:tabular-nums;color:var(--m-yazi);background:rgba(12,11,10,.45)}
.onEkran small{font-size:max(var(--k-enKucuk,12px),.86em)}
.prg-kart{width:min(100%,72em);max-height:100%;overflow-y:auto;display:grid;gap:.7em;padding:.9em 1.3em .9em;background:var(--m-zemin);border:1px solid var(--m-cizgi);box-shadow:.35em .45em 0 var(--m-golge)}
.prg-ust{display:flex;justify-content:space-between;align-items:baseline;gap:1em;padding-bottom:.3em;border-bottom:.18em solid var(--m-kulup);color:var(--m-soluk);font-size:max(var(--k-enKucuk,12px),.9em);letter-spacing:.12em;text-transform:uppercase}
.prg-ust b{font-family:var(--display);font-weight:400;font-size:1.9em;line-height:.9;letter-spacing:.04em;color:var(--m-kulup)}
/* U5: bültenin başlığında iki takım (gövde yazısı), altında lig · hafta · gün · stat */
.prg-ust .prg-ustAd{display:grid;gap:.15em;min-width:0}
.prg-ust .prg-ustAd b{font-family:var(--govde);font-weight:700;font-size:1.45em;line-height:1.1;letter-spacing:0;text-transform:none;color:var(--m-yazi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prg-ust .prg-ustAd small{font-size:max(var(--k-enKucuk,12px),.92em);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.onEkran button{font:inherit;color:var(--m-yazi);background:var(--m-panel);border:1px solid var(--m-cizgi);border-bottom-width:.16em;border-radius:.14em;padding:.3em .9em .22em;cursor:pointer}
.onEkran button:focus-visible{outline:.14em solid var(--m-kulup);outline-offset:.1em}
/* 2.8N: iki takım sütunu (künye, ilk 11, teknik direktör, son 5 maç) ve ortada başlama saati */
.prg-govde{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:1em;align-items:start}
.prg-taraf{display:grid;gap:.4em;min-width:0;padding:.6em .8em .7em;background:var(--m-panel);border:1px solid var(--m-cizgi)}
.prg-taraf h3{display:flex;justify-content:space-between;align-items:baseline;margin:.15em 0 0;font-family:var(--govde);font-weight:600;font-size:1em;line-height:1.1;letter-spacing:.06em;color:var(--m-vurgu);text-transform:uppercase}
.prg-taraf h3 small{font-family:var(--mono);font-size:max(var(--k-enKucuk,12px),.62em);letter-spacing:.08em;color:var(--m-soluk)}
.prg-takim{display:flex;align-items:center;gap:.7em;min-width:0}
.prg-takim .oe-arma{width:3.2em;height:3.7em;flex:none}
.prg-takim div{display:grid;min-width:0}
.prg-takim small{color:var(--m-soluk);letter-spacing:.04em}
.onEkran .prg-takim .oe-ad{font-size:2.1em}
.onEkran .prg-saha{margin:0;aspect-ratio:68/52}
.prg-td{margin:0;color:var(--m-soluk);font-size:max(var(--k-enKucuk,12px),.92em)}
.prg-td b{color:var(--m-yazi);font-weight:600}
.prg-skor{font-weight:600;font-variant-numeric:tabular-nums}
.prg-yok{margin:0;color:var(--m-soluk)}
.onEkran .oe-son li{grid-template-columns:3.9em 2.4em minmax(0,1fr) auto auto}
.prg-vs{display:grid;justify-items:center;gap:.15em;padding-top:2.2em}
.prg-vs b{font-family:var(--display);font-weight:400;font-size:3.6em;line-height:.85;color:var(--m-kulup)}
.prg-vs span{font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.prg-alt{display:flex;align-items:center;gap:1.2em;padding-top:.6em;border-top:.18em solid var(--m-cizgi);
  position:sticky;bottom:-.9em;margin-bottom:-.9em;padding-bottom:.9em;background:var(--m-zemin)}   /* R1-f: kitapçık kayarken Maça geç hep görünür */
.prg-hazirlik{flex:1;display:grid;gap:.25em;min-width:0}
/* N3: geçici test düğmesi (kesikli çerçeve, TEST etiketi); yayından önce kaldırılır */
.onEkran .prg-atla{flex:none;font:inherit;font-size:max(var(--k-enKucuk,12px),.95em);padding:.35em .7em;color:var(--m-soluk);background:transparent;border:1px dashed var(--m-cizgi);border-radius:.3em;cursor:pointer;white-space:nowrap}
.onEkran .prg-atla small{font-size:max(var(--k-enKucuk,12px),.75em);font-weight:600;letter-spacing:.1em;margin-right:.35em;color:var(--m-vurgu)}
.onEkran .prg-atla:hover:not(:disabled){color:var(--m-yazi);border-color:var(--m-yazi)}
.onEkran .prg-atla:disabled{opacity:.45;cursor:not-allowed}
.onEkran .prg-atla:focus-visible{outline:.1em solid var(--m-yazi);outline-offset:.15em}
.prg-etiket{font-size:max(var(--k-enKucuk,12px),.86em);letter-spacing:.1em;text-transform:uppercase;color:var(--m-soluk)}
.prg-cubuk{height:.8em;background:var(--m-panelUst);border:1px solid var(--m-cizgi);border-radius:.4em;overflow:hidden}
.prg-cubuk i{display:block;height:100%;width:0;background:var(--m-vurguZemin)}
.prg-durum{margin:0;color:var(--m-soluk)}
.prg-hata{color:var(--m-kirmizi)}
/* 2.8S: iki sayfa aynı yerde üst üste durur (yükseklik değişmez); gösterilmeyen görünmez */
.prg-yaprak{display:grid}
.prg-yaprak>.prg-sayfa{grid-area:1/1;min-width:0}
.prg-yaprak>.prg-gizli{visibility:hidden}
.prg-gosterge{display:flex;gap:.3em;margin-left:auto}
.onEkran .prg-gosterge button{font:inherit;font-size:max(var(--k-enKucuk,12px),.86em);letter-spacing:.08em;white-space:nowrap;padding:.1em .6em;background:var(--m-panel);border:1px solid var(--m-cizgi);color:var(--m-soluk);cursor:pointer}
.onEkran .prg-gosterge button[aria-selected="true"]{background:var(--m-vurguZemin);border-color:var(--m-vurgu);color:#1a1203}
.prg-lig{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1em;align-items:start}
.prg-sonlar{display:grid;gap:1em}
.prg-eksik{padding:.1em 0 0}
.onEkran .oe-tablo tbody tr:nth-child(even) td{background:rgba(40,28,12,.05)}
.onEkran .oe-tablo tbody tr.oe-kulup td{background:color-mix(in srgb,var(--m-kulup) 18%,transparent)}
.onEkran .oe-tablo tbody tr.oe-rakip td{background:color-mix(in srgb,var(--m-rakip) 18%,transparent)}
.onEkran .oe-ad{font-size:2em;white-space:normal}
.oe-ad{font-family:var(--display);font-weight:400;font-size:2.3em;line-height:.9;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oe-arma{width:2.5em;height:2.9em;background:linear-gradient(90deg,var(--a) 0 36%,var(--b) 36% 64%,var(--a) 64%);clip-path:polygon(0 0,100% 0,100% 64%,50% 100%,0 64%)}
.oe-f{display:inline-grid;place-items:center;width:1.45em;height:1.45em;font-weight:600;font-size:max(var(--k-enKucuk,12px),.9em);color:#fff}
.oe-G{background:var(--m-galibiyet)}.oe-B{background:var(--m-beraberlik)}.oe-M{background:var(--m-maglubiyet)}
.oe-saha{position:relative;aspect-ratio:68/60;margin:.45em;background:repeating-linear-gradient(180deg,var(--m-cim) 0 12.5%,var(--m-cimAcik) 0 25%)}
.oe-saha svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--m-sahaCizgi);stroke-width:.45;opacity:.6}
.oe-oy{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-38%)}
.oe-oy i{display:grid;place-items:center;width:1.75em;height:1.75em;border-radius:50%;font-style:normal;font-weight:600;font-size:max(var(--k-enKucuk,12px),.9em);background:var(--f);color:var(--y);box-shadow:0 0 0 .1em rgba(0,0,0,.55)}
.oe-oy span{font-size:max(var(--k-enKucuk,12px),.8em);line-height:1.15;white-space:nowrap;text-shadow:.1em .1em 0 #000,-.05em 0 0 #000;
  max-width:17cqw;overflow:hidden;text-overflow:ellipsis}   /* R1-f: dar sahada yazı tabanında komşu adlar çakışmasın (saha kendi kabıdır; en yakın ikili forvetler ~%18 arayla) */
.oe-saha{container-type:inline-size}
.oe-k{position:absolute;top:-.3em;left:65%;padding:0 .15em;font-style:normal;font-weight:600;font-size:max(var(--k-enKucuk,12px),.62em);line-height:1.2;background:var(--m-yazi);color:var(--m-panel)}
.oe-liste{list-style:none;margin:0;padding:.3em .55em .4em;display:grid;gap:.12em}
.oe-liste li{display:grid;align-items:center;gap:.5em;white-space:nowrap}
.oe-liste li>*{overflow:hidden;text-overflow:ellipsis}
.oe-liste b{font-weight:500}
.oe-soluk,.oe-liste small{color:var(--m-soluk)}
.oe-eksik li{grid-template-columns:.9em 1.4em minmax(0,auto) minmax(0,1fr) auto}
.oe-eksik li.oe-bos{display:block;color:var(--m-soluk)}
.oe-sakat,.oe-cezali{display:block;width:.9em;height:.9em}
.oe-sakat{background:linear-gradient(var(--m-kirmizi),var(--m-kirmizi)) center/100% 34% no-repeat,linear-gradient(var(--m-kirmizi),var(--m-kirmizi)) center/34% 100% no-repeat}
.oe-cezali{width:.66em;margin-inline:.12em;background:var(--m-kirmizi)}
.oe-son li{grid-template-columns:2.4em 1em minmax(0,1fr) auto auto}
.oe-son .oe-f{width:1.3em;height:1.3em;font-size:max(var(--k-enKucuk,12px),.8em)}
.oe-tablo{width:calc(100% - .8em);margin:.3em .4em .2em;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:max(var(--k-enKucuk,12px),.95em)}
.oe-tablo th{font-weight:500;color:var(--m-soluk);text-align:right;padding:.1em .3em;border-bottom:1px solid var(--m-cizgi)}
.oe-tablo td{text-align:right;padding:.07em .3em;white-space:nowrap}
.oe-tablo .oe-sol{text-align:left;max-width:11em;overflow:hidden;text-overflow:ellipsis}
.oe-tablo td:first-child{border-left:.3em solid transparent}
.oe-tablo tbody tr:nth-child(even) td{background:rgba(255,255,255,.03)}
.oe-tablo tbody tr.oe-kulup td{background:color-mix(in srgb,var(--m-kulup) 55%,transparent)}
.oe-tablo tbody tr.oe-rakip td{background:color-mix(in srgb,var(--m-rakip) 55%,transparent)}
.oe-tablo td.oe-b-cikma{border-left-color:var(--m-galibiyet)}.oe-tablo td.oe-b-playoff{border-left-color:var(--m-vurgu)}.oe-tablo td.oe-b-dusme{border-left-color:var(--m-kirmizi)}
.oe-lejant{display:flex;gap:1.2em;margin:0;padding:0 .55em .4em;color:var(--m-soluk);font-size:max(var(--k-enKucuk,12px),.82em)}
.oe-lejant span{display:flex;align-items:center;gap:.4em}
.oe-lejant span::before{content:"";display:block;width:.35em;height:1em}
.oe-lejant .oe-b-cikma::before{background:var(--m-galibiyet)}.oe-lejant .oe-b-playoff::before{background:var(--m-vurgu)}.oe-lejant .oe-b-dusme::before{background:var(--m-kirmizi)}
.onEkran .oe-ilerle{margin-left:auto;font-family:var(--display);font-size:2.2em;line-height:1;letter-spacing:.06em;padding:.18em 1.1em .08em;color:#1a1203;background:var(--m-vurguZemin);border:1px solid var(--m-vurgu);border-bottom-width:.16em;border-radius:.1em}
.onEkran .oe-ilerle:disabled{opacity:.45;cursor:not-allowed}
.onEkran .oe-ilerle:hover:not(:disabled){filter:brightness(1.08)}
.onEkran .oe-ilerle:active{transform:translateY(.06em);border-bottom-width:.1em}
.onEkran .oe-ilerle:focus-visible{outline:.1em solid var(--m-yazi);outline-offset:.15em}
/* ---- oda ekranı (js/ekran-oda.js): açık "kâğıt" arayüz; ölçüler karenin genişliğiyle orantılı (cqw); renkler STIL.kagit'ten ---- */
/* R1-f: biçimlendirilmemiş <small> tarayıcının "smaller" boyunu alır (×0,83) ve okunurluk tabanının altına düşer; özgüllüğü sıfır, sınıflı kurallar ezer */
:where(#screen) small{font-size:max(var(--k-enKucuk,12px),.83em)}
.oda{position:absolute;inset:0;z-index:3;font-family:var(--govde);font-size:var(--k-yaziBoyu,max(14px,1.5cqw));line-height:1.35;font-variant-numeric:tabular-nums;color:var(--k-yazi)}
/* U0: tablolar ve sayı sütunları tek genişlikli */
.oda table,.onEkran table,.macTelefon table{font-family:var(--mono)}
.oda button{font:inherit;font-size:1em;line-height:1.2;color:var(--k-yazi);background:var(--k-serit);border:1px solid var(--k-cizgi);border-bottom-width:.16em;border-radius:.14em;padding:.3em .7em .22em;cursor:pointer}
.oda button:hover:not(:disabled){border-color:var(--k-soluk)}
.oda button:disabled{opacity:.5;cursor:not-allowed}
.oda button:focus-visible,.oda input:focus-visible{outline:.14em solid var(--k-kulup);outline-offset:.1em}
.oda button[aria-pressed="true"]{background:var(--k-vurguZemin);border-color:var(--k-vurgu);color:var(--k-vurguYazi)}
.oda p{margin:0}
.od-ust{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:center;gap:1em;padding:.3em .9em .25em;background:var(--k-serit);border-bottom:.16em solid var(--k-kulup);
  color:var(--k-soluk);font-size:max(var(--k-enKucuk,12px),.82em);letter-spacing:.1em;text-transform:uppercase}
.od-tarih{position:absolute;top:2.7em;left:.9em;display:grid;padding:.3em .7em .15em;background:var(--k-zemin);border:1px solid var(--k-cizgi);box-shadow:.2em .25em 0 var(--k-golge)}
.od-tarih b{font-family:var(--display);font-weight:400;font-size:1.9em;line-height:.9;letter-spacing:.03em}
.od-tarih span{font-family:var(--display);font-size:2.6em;line-height:.9;color:var(--k-kulup)}
/* U6 (envanter 23, tercih 3): masadaki nesneler sol sütun değil, masanın altında ince şerit (alt şeridin hemen üstünde, ortada) */
.od-nesneler{position:absolute;left:50%;bottom:5.4em;transform:translateX(-50%);display:flex;flex-wrap:nowrap;align-items:center;gap:.35em;max-width:96%;
  padding:.25em .35em;background:rgba(24,16,8,.38);border-radius:.45em;box-shadow:0 .2em .6em rgba(0,0,0,.25)}
.oda .od-nesne{display:flex;align-items:center;gap:.45em;min-width:0;white-space:nowrap;padding:.3em .75em .25em;font-weight:600;background:var(--k-zemin);box-shadow:.12em .15em 0 var(--k-golge)}
/* U0 rozet dili: sayı mürekkep zeminde, karar kırmızı, "yeni" mürekkep nokta (metni erişilebilir kalır); amber yalnız ana eylem ve seçili */
.od-rozet{font-style:normal;font-weight:600;font-size:max(var(--k-enKucuk,12px),.8em);padding:0 .45em;border-radius:1em;background:var(--k-yazi);color:var(--k-serit);margin-left:auto}
.od-rozet[data-rozet="yeni"]{width:.62em;height:.62em;padding:0;overflow:hidden;white-space:nowrap;text-indent:1em;background:var(--k-mavi)}
.od-rozetAcil{background:var(--k-kirmizi);color:#fff}
.oda .od-kucuk{font-size:max(var(--k-enKucuk,12px),.82em);font-weight:400;color:var(--k-soluk);min-width:0}
.od-panel{position:absolute;top:2.5em;right:.7em;bottom:5.3em;width:57%;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--k-zemin);border:1px solid var(--k-cizgi);box-shadow:.35em .45em 0 var(--k-golge)}
.od-panel>header{display:flex;justify-content:space-between;align-items:center;gap:1em;padding:.25em .5em .15em .8em;background:var(--k-zeminKoyu);border-bottom:1px solid var(--k-cizgi)}
.od-panel h3{margin:0;font-family:var(--display);font-weight:400;font-size:2em;line-height:1;letter-spacing:.04em;color:var(--k-kulup)}
.od-icerik{padding:.6em .8em .8em;display:grid;gap:.5em;align-content:start;overflow-y:auto}
.od-icerik h4{margin:.2em 0 0;font-size:max(var(--k-enKucuk,12px),.82em);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--k-vurgu);display:flex;flex-wrap:wrap;gap:.2em .6em;align-items:baseline}
.od-icerik h4 small{font-weight:400;letter-spacing:.04em;color:var(--k-soluk);text-transform:none}
.od-icerik b{font-weight:600}
.od-olcu{margin:0;padding:.4em .6em;max-height:12em;overflow:auto;white-space:pre-wrap;font:inherit;font-size:max(var(--k-enKucuk,12px),.9em);font-variant-numeric:tabular-nums;background:var(--k-serit);border:1px solid var(--k-cizgi)}
.od-kutu{display:grid;gap:.4em;padding:.5em .6em;background:var(--k-serit);border:1px solid var(--k-cizgi);border-left:.3em solid var(--k-cizgi)}
.od-kutu h4{margin:0}
.od-not{color:var(--k-soluk)}
.od-uyari,.od-eksi,.od-zorunlu,.od-d-kacirildi{color:var(--k-kirmizi)}
.od-ertelenebilir{color:var(--k-vurgu)}.od-istege,.od-d-ertelendi{color:var(--k-soluk)}.od-d-yapildi{color:var(--k-yesil)}
.od-etiket{font-size:max(var(--k-enKucuk,12px),.74em);font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:.02em .4em;border:1px solid currentColor;white-space:nowrap}
.od-liste,.od-kanit{list-style:none;margin:0;padding:0;display:grid;gap:.15em}
.od-satir{display:grid;grid-template-columns:var(--an,7.4em) minmax(0,1fr) auto;align-items:center;gap:.6em;width:100%;text-align:left;padding:.12em .4em}
.oda button.od-satir{background:transparent;border-color:transparent;border-bottom-width:1px}
.oda button.od-satir[aria-pressed="true"]{background:var(--k-serit);border-color:var(--k-vurgu);color:var(--k-yazi)}
.od-ad{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.od-an{color:var(--k-soluk);font-variant-numeric:tabular-nums}
.od-kanit li{display:grid;grid-template-columns:7.4em minmax(0,1fr);gap:.6em}
.od-dugmeler{display:flex;flex-wrap:wrap;gap:.5em}
.oda .od-birincil{background:var(--k-vurguZemin);border-color:var(--k-vurgu);color:var(--k-vurguYazi);font-weight:600}
.oda .od-tehlike{color:var(--k-kirmizi);border-color:var(--k-kirmizi)}
.oda button.od-baglanti{background:transparent;border:0;border-bottom:1px solid var(--k-soluk);border-radius:0;padding:0;text-align:left}
.od-sekmeler{display:flex;flex-wrap:wrap;gap:.3em}
.od-dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.1em 1em;margin:0}
.od-dl dt{color:var(--k-soluk)}.od-dl dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.od-alt{position:absolute;inset:auto 0 0 0;display:flex;align-items:center;gap:1em;padding:.45em .9em .4em;background:var(--k-serit);border-top:.16em solid var(--k-cizgi)}
.od-altYazi{flex:1;min-width:0;display:grid;gap:.1em}
.od-mesaj,.od-durak{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.od-durak{color:var(--k-soluk);font-size:max(var(--k-enKucuk,12px),.92em);-webkit-line-clamp:1}
.od-durakUyari{-webkit-line-clamp:2}
/* 2.8Q: ajandadaki seçili işin eylemleri alt şeritte; ana düğme sağda */
.od-altDugmeler{display:flex;align-items:center;gap:.5em;flex:none}
.oda .od-ikinci{white-space:nowrap;padding:.3em .8em .2em;background:var(--k-zemin)}
.oda .od-ana{font-family:var(--display);font-size:2.1em;line-height:1;letter-spacing:.06em;padding:.18em 1em .08em;background:var(--k-vurguZemin);border-color:var(--k-vurgu);color:var(--k-vurguYazi);white-space:nowrap}
.oda .od-ana:active:not(:disabled){transform:translateY(.06em)}
.od-bozuk{left:12%;right:12%;width:auto;bottom:auto}
/* test bilgisi (GEÇİCİ): küçük TEST simgesi; üzerine gelince, odakta ya da tıklayınca hemen altında bilgi kutusu açılır.
   Kutu düzeni itmez (simge yerinden kaymaz): dikeyde kendi yerinde, yatayda panel içeriğinin genişliğinde durur; panelden taşmaz */
.od-icerik{position:relative}
.od-testIpucu{display:inline;margin-left:.3em}
.oda button.od-testSimge{font-size:max(var(--k-enKucuk,12px),.68em);font-weight:600;letter-spacing:.08em;line-height:1.3;padding:.05em .35em;border:1px dashed var(--k-kulup);border-radius:.2em;color:var(--k-kulup);background:transparent;vertical-align:.1em}
.od-test{display:none;position:absolute;z-index:4;left:.8em;right:.8em;margin-top:.25em;padding:.3em .55em;box-shadow:.15em .2em 0 var(--k-golge);border:1px dashed var(--k-kulup);color:var(--k-soluk);font-size:max(var(--k-enKucuk,12px),.84em);font-weight:400;line-height:1.3;letter-spacing:0;text-transform:none;white-space:normal;overflow-wrap:anywhere;
  background-color:var(--k-zemin);background-image:repeating-linear-gradient(135deg,transparent 0 .5em,rgba(180,36,28,.05) 0 1em)}
.od-testIpucu:hover>.od-test,.od-testIpucu:focus-within>.od-test,.od-testIpucu.acik>.od-test{display:block}
.od-tavsiye{display:flex;flex-wrap:wrap;align-items:center;gap:.3em .7em}
.od-s-tutuldu{color:var(--k-yesil)}.od-s-bozuldu{color:var(--k-kirmizi)}.od-s-acik{color:var(--k-vurgu)}
.od-gazete{border-left-color:var(--k-yazi)}
.od-manset{font-family:var(--display);font-size:1.7em;line-height:1;letter-spacing:.02em}
.od-genis{width:auto;left:.7em}
.od-kadro{width:100%;border-collapse:collapse;font-size:max(var(--k-enKucuk,12px),.86em);font-variant-numeric:tabular-nums}
.od-kadro th{font-weight:500;color:var(--k-soluk);text-align:right;border-bottom:1px solid var(--k-cizgi);padding:.1em .25em}
.od-kadro td{text-align:right;padding:.05em .25em;white-space:nowrap}
.od-kadro th:nth-child(2),.od-kadro td:nth-child(2){text-align:left}
.od-kadro tbody tr:nth-child(even) td{background:rgba(40,28,12,.05)}
.od-yedek td{color:var(--k-soluk)}
/* U3: Sonra yığını (masada cevap bekleyen kararlar; son cevabı yakın olan üstte, en çok üç kâğıt; sağ altta) ve göz atmanın içerikleri */
.od-sonra{position:absolute;right:.9em;bottom:8.6em;max-width:30%;display:grid;gap:.3em;justify-items:end}
.od-sonra h4{margin:0;font-size:max(var(--k-enKucuk,12px),.78em);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--k-serit);text-shadow:0 .08em .3em rgba(0,0,0,.55)}
.oda button.od-sonraKagit{display:grid;gap:.05em;width:100%;min-width:12em;padding:.35em .7em .3em;text-align:left;background:var(--k-serit);border:1px solid var(--k-cizgi);border-left:.3em solid var(--k-kirmizi);box-shadow:.2em .25em 0 var(--k-golge)}
.od-sonraKagit b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.od-sonraKagit small{color:var(--k-soluk);font-size:max(var(--k-enKucuk,12px),.82em);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.od-sonra>small{color:var(--k-serit);text-shadow:0 .08em .3em rgba(0,0,0,.55)}
.od-gozGun{list-style:none;margin:0 0 .6em;padding:0;display:grid;gap:.2em}
.od-gozGun li{display:grid;grid-template-columns:6.6em minmax(0,1fr);gap:.6em;padding:.25em .45em;border-left:.25em solid var(--k-cizgi);background:var(--k-zemin)}
.od-gozGun time{font-variant-numeric:tabular-nums;color:var(--k-soluk)}
.od-gozGun .od-gozAnt{border-left-color:var(--k-yesil)}
.od-gozGun .od-gozMac{border-left-color:var(--k-kirmizi)}
.od-gozGun .od-gozBitti{opacity:.6}
.od-gozGun .od-gozIsaret{background:var(--k-vurguZemin);border-left-color:var(--k-vurgu);color:var(--k-vurguYazi);font-weight:600}
.od-gozGun .od-gozIsaret time{color:inherit}
.od-gozGun .od-gozCakis{border-left-color:var(--k-kirmizi);color:var(--k-kirmizi);font-weight:600}
.od-gozKasa{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.3em 1em;margin:0 0 .6em}
.od-gozKasa dt{color:var(--k-soluk)}
.od-gozKasa dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.od-gozlem{position:absolute;left:.9em;bottom:8.6em;max-width:36%;display:grid;gap:.35em;padding:.45em .7em;background:var(--k-zemin);border:1px solid var(--k-cizgi);border-left:.3em solid var(--k-yesil);box-shadow:.2em .25em 0 var(--k-golge)}
.od-gozlem small{display:block}
.oda .od-yer{font-weight:600;border-color:var(--k-yesil)}
/* görünmez ama klavyeyle odaklanınca beliren düğme (balkon kapısı, 2.8D) */
.oda .od-gizli:not(:focus):not(:focus-visible){position:absolute;width:1px;height:1px;min-width:0;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);border:0;white-space:nowrap}
/* ---- 2.8C tek konu ekranları: dosya, kasa, ajanda günleri, telefon uygulamaları, ayar bölümleri ---- */
.od-kategori{display:inline-flex;align-items:center;gap:.4em;font-size:max(var(--k-enKucuk,12px),.82em);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--k-soluk)}
.od-kSimge{display:inline-grid;place-items:center;width:1.6em;height:1.6em;font-style:normal;font-weight:600;letter-spacing:0;border-radius:.25em;background:var(--k-kulup);color:var(--k-serit)}
.od-sekmeler button{font-size:max(var(--k-enKucuk,12px),.92em)}
.od-ayarSatir{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.4em 1em;padding:.35em 0;border-bottom:1px solid var(--k-cizgi)}
/* R1-b: kayıt dosyasını yükleme onayı */
.od-iceOnay{display:grid;gap:.35em;margin:.5em 0;padding:.55em .7em;background:var(--k-serit);border:1px solid var(--k-cizgi);border-left:.25em solid var(--k-kirmizi)}
.od-iceOnay p{margin:0}
/* bilinen tutar ve son tarih kesilmesin: ajanda ve kasa satırları sarar */
.od-sar .od-ad{white-space:normal;overflow:visible}
.od-ustSag{display:flex;align-items:center;gap:.8em;min-width:0}
/* ---- maç telefonu (js/ekran-mac-telefon.js, 2.8F): sağda okunur boyutta cihaz; açık tonlar STIL.kagit ---- */
.macTelefon{position:absolute;z-index:5;top:4%;bottom:4%;right:3%;width:36%;font-family:var(--govde);font-size:var(--k-yaziBoyu,max(14px,1.5cqw));line-height:1.35;font-variant-numeric:tabular-nums;color:var(--k-yazi)}
.mt-cihaz{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:.35em}
/* U2: üstte yalnız Kapat × (odak kabının başlığındaki gibi sağda); “Telefon” başlık şeridi kalktı */
.mt-ust{display:flex;justify-content:flex-end;align-items:center;font-size:max(var(--k-enKucuk,12px),.9em)}
.macTelefon button{font:inherit;color:var(--k-yazi);background:var(--k-serit);border:1px solid var(--k-cizgi);border-bottom-width:.16em;border-radius:.2em;padding:.25em .6em .2em;cursor:pointer}
.macTelefon button:focus-visible{outline:.14em solid var(--k-kulup);outline-offset:.1em}
.od-kayit{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.8}
.oda button.od-duraklat{font-size:1em;letter-spacing:.1em;text-transform:uppercase;padding:.1em .6em .05em;border-bottom-width:1px}
/* U6 (envanter 20): kâğıtta hafif doku (iki kat ince nokta; statik, okunurluğu bozmaz) */
.oda .odk-kagit,.oda .dsy-sayfa,.oda .dft-sayfa,.oda .zm-sahne{background-image:radial-gradient(rgba(110,90,50,.06) .06em,transparent .07em),radial-gradient(rgba(110,90,50,.045) .05em,transparent .06em);
  background-size:.33em .33em,.71em .71em;background-position:0 0,.17em .29em}
/* U6 (envanter 17): balkonda yarım odak — perde yok (antrenman net ve canlı), iş sağ yarıda */
.oda[data-yer="balkon"] .odk-perde{-webkit-backdrop-filter:none;backdrop-filter:none;background:linear-gradient(90deg,transparent 35%,rgba(24,16,8,.32) 55%)}
.oda[data-yer="balkon"] section.odk{left:auto;right:2%}
.oda[data-yer="balkon"] section.odk:not([data-boy="cihaz"]){--odk-en:50%}
/* U4 (envanter 21): basılan kâğıt düğme bir an aşağı iner (gölgesi kalkar); sürüklenen kart ve devre dışı düğme etkilenmez */
.oda button:not(:disabled):active,.onEkran button:not(:disabled):active,.macTelefon button:not(:disabled):active,.mac-sonu button:not(:disabled):active,.karar-ani button:not(:disabled):active{transform:translateY(.1em);box-shadow:none;filter:brightness(.96)}
/* genel duraklatma göstergesi (2.8B): ekranı karartmaz, yalnız küçük etiket; tıklamaları engellemez */
.duraklatildi{position:absolute;z-index:6;top:2.6%;left:50%;transform:translateX(-50%);margin:0;padding:.25em .9em .2em;pointer-events:none;
  font-family:var(--govde);font-size:max(12px,1.25cqw);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#1a1203;background:var(--amber);border:1px solid #b9791a;box-shadow:0 .2em .6em rgba(0,0,0,.25)}
html,body{margin:0}

<div class="wrap">
  <div class="screen" id="screen">
    <canvas id="view" width="960" height="720" aria-label="Oyun görüntüsü: başkanın gözünden kulüp ve stat"></canvas>
    <div class="onEkran" id="onEkran" role="dialog" aria-label="Maç öncesi bülteni" hidden></div>

  <script src="js/gecis-karti.js"></script>

  <div class="controls" id="baskanDugmeleri">

      <div class="seg">
        <button type="button" id="btnDuraklat" aria-pressed="false" title="Kısayol: boşluk tuşu">Duraklat</button>
        <button type="button" id="btnTelefon" aria-pressed="false" title="Masadaki telefon (T)">Telefon</button>

        <button type="button" id="btnHizliBitir" class="test-dugme" title="Test aşaması: kalan maçı görüntüsüz oynatıp maç sonuna geçer (yayından önce kaldırılacak)"><small>TEST</small> <span>Maçı bitir</span></button>
      </div>
    </div>

    <div class="grp"><span class="lbl">Maç hızı <span class="izAn" id="izlemeAn">· önemli an</span></span>
      <div class="seg" id="izlemeHiz">
        <button type="button" data-izhiz="1" aria-pressed="false" title="Normal hız (tuş 1)">×1</button>

        <button type="button" data-izhiz="4" aria-pressed="false" title="Dört kat (tuş 4); önemli anlarda normal hıza iner">×4</button>
      </div>
    </div>
  </div>

  <details class="gelistirici" aria-label="Geliştirici">
    <summary>Geliştirici · deneme ayarları</summary>
    <div class="satir">
      <div class="grp"><span class="lbl">Maç hızı</span>
        <div class="seg" id="hizSeg">
          <button type="button" data-hiz="1" aria-pressed="false">1x</button>
          <button type="button" data-hiz="2" aria-pressed="false">2x</button>
          <button type="button" data-hiz="4" aria-pressed="false">4x</button>
          <button type="button" data-hiz="8" aria-pressed="false">8x</button>
        </div>
      </div>
      <div class="grp"><span class="lbl">Durdurma</span>
        <div class="seg"><button type="button" id="btnDurdur" aria-pressed="false">Durdur</button></div>
      </div>
    </div>
    <div class="satir">
      <label>Ev tarzı (TEST)<select id="tarzEv"><option value="" disabled>—</option></select></label>
      <label>Konuk tarzı (TEST)<select id="tarzKonuk"><option value="" disabled>—</option></select></label>
    </div>
    <p class="bilgi">Tarz (TEST): <span id="tarzTest">—</span><br>Değişiklik bir sonraki duruşta başlar, takım ~3 dakikada yeni tarza oturur.</p>
  </details>
