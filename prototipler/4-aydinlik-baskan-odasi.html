<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chairman — aydınlık başkan odası (prototip)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Jersey+10&display=swap" rel="stylesheet">
<!-- Yol haritası 2.5, bölüm A: yerleşim ve etkileşim onayı için prototip. Gerçek kural dosyalarını (../js) kullanır; kariyer yalnız bellekte tutulur,
     oyunun kaydına dokunmaz. Adres parametreleri: ?baslangic=sikisik|rahat|duzenli, ?sponsor=nakitSikisik|pazarlik, ?sayman=kisi-N, ?dunya=tohum,
     ?yazi=buyuk, ?panel=telefon|ajanda|dosya (açık başlasın). -->
<style>
:root{color-scheme:dark;--room:#12110f;--text:#efe7d6;--muted:#9a9282;--display:"Jersey 10","Arial Narrow",Impact,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--room);color:var(--text)}
body{font-family:var(--mono);font-size:14px;line-height:1.55;padding-inline:16px;padding-block:18px 40px}
.wrap{max-width:1040px;margin-inline:auto;display:grid;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 18px}
.top h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,5vw,52px);line-height:.85;letter-spacing:.02em}
.top p,.not{margin:0;color:var(--muted);font-size:12px}
.not a{color:#ffb530}
.screen{position:relative;width:100%;max-width:900px;margin-inline:auto;aspect-ratio:4/3;overflow:hidden;background:#000;box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 1px #2e2b26;container-type:inline-size}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.nogl{position:absolute;inset:0;display:grid;place-items:center;margin:0;padding:24px;text-align:center;color:var(--muted)}
[hidden]{display:none!important}
/* ---- oda ekranı (js/ekran-oda.js): açık "kâğıt" arayüz; ölçüler karenin genişliğiyle orantılı (cqw); renkler STIL.kagit'ten ---- */
.oda{position:absolute;inset:0;z-index:3;font-family:var(--mono);font-size:var(--k-yaziBoyu,1.42cqw);line-height:1.35;color:var(--k-yazi)}
.oda button{font:inherit;font-size:1em;line-height:1.2;color:var(--k-yazi);background:var(--k-serit);border:1px solid var(--k-cizgi);border-bottom-width:.16em;border-radius:.14em;padding:.3em .7em .22em;cursor:pointer}
.oda button:hover:not(:disabled){border-color:var(--k-soluk)}
.oda button:disabled{opacity:.5;cursor:not-allowed}
.oda button:focus-visible,.oda input:focus-visible{outline:.14em solid var(--k-kulup);outline-offset:.1em}
.oda button[aria-pressed="true"]{background:var(--k-vurguZemin);border-color:var(--k-vurgu);color:#1a1203}
.oda p{margin:0}
.od-ust{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:center;gap:1em;padding:.3em .9em .25em;background:var(--k-serit);border-bottom:.16em solid var(--k-kulup);
  color:var(--k-soluk);font-size:.82em;letter-spacing:.1em;text-transform:uppercase}
.od-tarih{position:absolute;top:2.7em;left:.9em;display:grid;padding:.3em .7em .15em;background:var(--k-zemin);border:1px solid var(--k-cizgi);box-shadow:.2em .25em 0 var(--k-golge)}
.od-tarih b{font-family:var(--display);font-weight:400;font-size:1.9em;line-height:.9;letter-spacing:.03em}
.od-tarih span{font-family:var(--display);font-size:2.6em;line-height:.9;color:var(--k-kulup)}
.od-nesneler{position:absolute;top:10.2em;left:.9em;display:grid;gap:.4em;justify-items:start}
.oda .od-nesne{display:flex;align-items:center;gap:.5em;min-width:8.4em;padding:.4em .8em .3em;font-weight:600;background:var(--k-zemin);box-shadow:.2em .25em 0 var(--k-golge)}
.od-rozet{font-style:normal;font-weight:600;font-size:.8em;padding:0 .45em;border-radius:1em;background:var(--k-vurguZemin);color:#1a1203;margin-left:auto}
.od-rozetAcil{background:var(--k-kirmizi);color:#fff}
.oda .od-kucuk{font-size:.82em;font-weight:400;color:var(--k-soluk);min-width:0}
.od-panel{position:absolute;top:2.5em;right:.7em;bottom:5.3em;width:57%;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--k-zemin);border:1px solid var(--k-cizgi);box-shadow:.35em .45em 0 var(--k-golge)}
.od-panel>header{display:flex;justify-content:space-between;align-items:center;gap:1em;padding:.25em .5em .15em .8em;background:var(--k-zeminKoyu);border-bottom:1px solid var(--k-cizgi)}
.od-panel h3{margin:0;font-family:var(--display);font-weight:400;font-size:2em;line-height:1;letter-spacing:.04em;color:var(--k-kulup)}
.od-icerik{padding:.6em .8em .8em;display:grid;gap:.5em;align-content:start;overflow-y:auto}
.od-icerik h4{margin:.2em 0 0;font-size:.82em;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--k-vurgu);display:flex;flex-wrap:wrap;gap:.2em .6em;align-items:baseline}
.od-icerik h4 small{font-weight:400;letter-spacing:.04em;color:var(--k-soluk);text-transform:none}
.od-icerik b{font-weight:600}
.od-kutu{display:grid;gap:.4em;padding:.5em .6em;background:var(--k-serit);border:1px solid var(--k-cizgi);border-left:.3em solid var(--k-cizgi)}
.od-kutu h4{margin:0}
.od-acil{border-left-color:var(--k-kirmizi)}
.od-not{color:var(--k-soluk)}
.od-uyari,.od-eksi,.od-zorunlu,.od-m-kararBekliyor,.od-d-kacirildi{color:var(--k-kirmizi)}
.od-ertelenebilir,.od-m-ekipte{color:var(--k-vurgu)}.od-istege,.od-d-ertelendi,.od-m-haberBekliyor{color:var(--k-soluk)}.od-d-yapildi,.od-m-kapandi{color:var(--k-yesil)}
.od-etiket{font-size:.74em;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:.02em .4em;border:1px solid currentColor;white-space:nowrap}
.od-liste,.od-haberler,.od-kanit,.od-secenekler{list-style:none;margin:0;padding:0;display:grid;gap:.15em}
.od-satir{display:grid;grid-template-columns:var(--an,7.4em) minmax(0,1fr) auto;align-items:center;gap:.6em;width:100%;text-align:left;padding:.12em .4em}
.oda button.od-satir{background:transparent;border-color:transparent;border-bottom-width:1px}
.oda button.od-satir[aria-pressed="true"]{background:var(--k-serit);border-color:var(--k-vurgu);color:var(--k-yazi)}
.od-ad{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.od-an{color:var(--k-soluk);font-variant-numeric:tabular-nums}
.od-bitti .od-ad{color:var(--k-soluk)}
.od-kanit li,.oda button.od-haber{display:grid;grid-template-columns:7.4em minmax(0,1fr);gap:.6em}
.oda button.od-haber{width:100%;text-align:left;background:transparent;border-color:transparent;border-bottom:1px solid var(--k-cizgi);border-radius:0;padding:.25em .2em}
.od-yeni{font-style:normal;font-size:.76em;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--k-kirmizi)}
.od-bilinen{margin:0;padding:0 0 0 1.1em;display:grid;gap:.15em}
.od-secenekler{gap:.4em}
.od-secenekler li{display:grid;gap:.05em;padding-left:.5em;border-left:.2em solid var(--k-cizgi)}
.od-secenekler li:has([aria-pressed="true"]){border-left-color:var(--k-vurgu)}
.od-secenekler small{color:var(--k-soluk);font-size:.88em;line-height:1.2}
.oda .od-secenek{justify-self:start;text-align:left;padding:.18em .6em .12em}
.od-dugmeler{display:flex;flex-wrap:wrap;gap:.5em}
.oda .od-birincil{background:var(--k-vurguZemin);border-color:var(--k-vurgu);color:#1a1203;font-weight:600}
.oda .od-tehlike{color:var(--k-kirmizi);border-color:var(--k-kirmizi)}
.oda button.od-baglanti{background:transparent;border:0;border-bottom:1px solid var(--k-soluk);border-radius:0;padding:0;text-align:left}
.od-sekmeler{display:flex;flex-wrap:wrap;gap:.3em}
.od-dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.1em 1em;margin:0}
.od-dl dt{color:var(--k-soluk)}.od-dl dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.od-ayar{display:flex;flex-wrap:wrap;align-items:center;gap:.6em 1em}
.od-ayar input{width:12em;accent-color:var(--k-kulup)}
.od-alt{position:absolute;inset:auto 0 0 0;display:flex;align-items:center;gap:1em;padding:.45em .9em .4em;background:var(--k-serit);border-top:.16em solid var(--k-cizgi)}
.od-altYazi{flex:1;min-width:0;display:grid;gap:.1em}
.od-mesaj,.od-durak{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.od-durak{color:var(--k-soluk);font-size:.92em;-webkit-line-clamp:1}
.oda .od-ana{font-family:var(--display);font-size:2.1em;line-height:1;letter-spacing:.06em;padding:.18em 1em .08em;background:var(--k-vurguZemin);border-color:var(--k-vurgu);color:#1a1203;white-space:nowrap}
.oda .od-ana:active:not(:disabled){transform:translateY(.06em)}
.od-bozuk{left:12%;right:12%;width:auto;bottom:auto}
.od-test{margin-top:.15em;padding:.2em .45em;border:1px dashed var(--k-kulup);color:var(--k-soluk);font-size:.84em;line-height:1.25;background:repeating-linear-gradient(135deg,transparent 0 .5em,rgba(180,36,28,.05) 0 1em)}
.od-test b{color:var(--k-kulup);font-size:.85em;letter-spacing:.1em;margin-right:.3em}
.od-tavsiye{display:flex;flex-wrap:wrap;align-items:center;gap:.3em .7em}
.od-s-tutuldu{color:var(--k-yesil)}.od-s-bozuldu{color:var(--k-kirmizi)}.od-s-acik{color:var(--k-vurgu)}
.od-gazete{border-left-color:var(--k-yazi)}
.od-manset{font-family:var(--display);font-size:1.7em;line-height:1;letter-spacing:.02em}
.od-genis{width:auto;left:.7em}
.od-kadro{width:100%;border-collapse:collapse;font-size:.86em;font-variant-numeric:tabular-nums}
.od-kadro th{font-weight:500;color:var(--k-soluk);text-align:right;border-bottom:1px solid var(--k-cizgi);padding:.1em .25em}
.od-kadro td{text-align:right;padding:.05em .25em;white-space:nowrap}
.od-kadro th:nth-child(2),.od-kadro td:nth-child(2){text-align:left}
.od-kadro tbody tr:nth-child(even) td{background:rgba(40,28,12,.05)}
.od-yedek td{color:var(--k-soluk)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Chairman</h1>
    <p>Prototip · aydınlık başkan odası · yol haritası 2.5</p>
  </header>
  <div class="screen" id="screen">
    <canvas id="view" width="640" height="480" aria-label="Başkanın masasından görülen aydınlık oda: masada telefon, ajanda defteri ve dosya"></canvas>
    <canvas id="hud" width="640" height="480" aria-hidden="true"></canvas>
    <div class="oda" id="oda" role="application" aria-label="Başkan odası"></div>
  </div>
  <p class="not">Bu sayfa yerleşim ve etkileşim denemesidir; kariyer yalnız bellekte tutulur. Başlangıçlar:
    <a href="?baslangic=sikisik&sponsor=nakitSikisik&dunya=7">kasa dar</a> ·
    <a href="?baslangic=rahat&sponsor=pazarlik&sayman=kisi-9&dunya=7">kasada pay var</a> ·
    <a href="?baslangic=duzenli&dunya=7">düzenli</a> · Klavye: 1 telefon, 2 ajanda, 3 dosya, Esc kapat.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../js/ortak.js"></script>
<script src="../js/stil-99.js"></script>
<script src="../js/sunum-durumu.js"></script>
<script src="../js/stadyum-tarifleri.js"></script>
<script src="../js/kadrolar.js"></script>
<script src="../js/kariyer.js"></script>
<script src="../js/takvim.js"></script>
<script src="../js/maliye.js"></script>
<script src="../js/ajanda.js"></script>
<script src="../js/mesele.js"></script>
<script src="../js/yonetim.js"></script>
<script src="../js/uyum-sponsor.js"></script>
<script src="../js/olay.js"></script>
<script src="../js/paket-odeme.js"></script>
<script src="../js/paket-hoca.js"></script>
<script src="../js/paket-basin.js"></script>
<script src="../js/paket-destek.js"></script>
<script src="../js/uyum-icerik2.js"></script>
<script src="../js/soz.js"></script>
<script src="../js/mesajlar.js"></script>
<script src="../js/test-gorunum.js"></script>
<script src="../js/kayit.js"></script>
<script src="../js/kariyer-ornek.js"></script>
<script src="../js/baslangic.js"></script>
<script src="../js/goruntu.js"></script>
<script src="../js/oda.js"></script>
<script src="../js/portre.js"></script>
<script src="../js/ekran-telefon.js"></script>
<script src="../js/ekran-oda.js"></script>
<script>
/* prototip oturumu: bellek deposu, gerçek komut ve kayıt yolu (kayitOturumu) */
const PROTOTIP={oturum:null,ekran:null};
{
  const q=new URLSearchParams(location.search),al=ad=>q.get(ad)||undefined,depo=bellekDeposu();
  const rastgele=()=>Math.floor(Math.random()*0x100000000),dunya=parseInt(al('dunya'),10);
  const kur=()=>{let k;try{k=kariyerBaslat({tohum:Number.isFinite(dunya)?dunya:rastgele(),baslangic:al('baslangic'),sponsor:al('sponsor'),sayman:al('sayman'),hoca:al('hoca')});}catch(e){k=kariyerBaslat({tohum:rastgele()});}
    PROTOTIP.oturum=kayitOturumu(depo,'oda-deneme',k,false);PROTOTIP.oturum.kaydet();return'Yeni kariyer başladı. '+BASLANGICLAR[k.icerik.baslangic].acilis;};
  const ilk=kur(),saatYaz=d=>d.tarih?d.tarih.slice(5).split('-').reverse().join('.')+' '+saatYazi(d.dakika):'';
  const oyun={
    get kariyer(){return PROTOTIP.oturum.kariyer;},
    komut:(f,kaydetme)=>PROTOTIP.oturum.uygula(f,kaydetme),
    kayitYazi:()=>'Prototip · kayıt yalnız bellekte · '+saatYaz(PROTOTIP.oturum.durum),
    kayitHata:()=>false,kayitTamam:()=>PROTOTIP.oturum.durum.tamam,yenidenKaydet:()=>PROTOTIP.oturum.kaydet(),
    yeniKariyer:kur,macaGit:()=>{alert('Prototip: burada maç bülteni ve 3B maç günü açılır.');},
    donus:q.get('donus')==='1',ilkMesaj:ilk,bozukHata:null,bozuguSaklaVeBasla:kur
  };
  const ayarlar={yazi:q.get('yazi')==='buyuk'?'buyuk':'normal',test:q.get('test')!=='0',kaydet(){}};
  PROTOTIP.ekran=odaEkraniKur($('oda'),oyun,ayarlar);
  PROTOTIP.ekran.ciz('.od-ana');
  if(['telefon','ajanda','dosya','ayar'].includes(q.get('panel')))PROTOTIP.ekran.ac(q.get('panel'));
  let son=0;
  const kare=t=>{const dt=Math.min(0.05,Math.max(0,(t-son)/1000));son=t;odaKare(duraklatmaVar()?0:dt);odaCiz();requestAnimationFrame(kare);};
  requestAnimationFrame(t=>{son=t;requestAnimationFrame(kare);});
}
</script>
</body>
</html>
