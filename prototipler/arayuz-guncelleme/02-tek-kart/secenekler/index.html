<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Haberler — kart önizlemesi (10 seçenek)</title>
<!-- Arayüz güncellemesi 2. madde (araclar/plan/arayuz-guncelleme.md): Haberler tamamen kart. Önizleme; oyun kodu değil, metinler TEST.
     Çerçeve 1. maddenin (rafine klasik, Rubik). Adres: ?t=1..10 tek seçenek, ?hepsi=1 hepsi küçük; &on=sag|sol|alt önizleme durumu, &ek=1 ilk eki açık. -->
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Jersey+10&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--lac:#14214F;--dug:#1E2E66;--kutu:#0E1838;--cizgi:#2C3D7A;--krem:#F6F1E1;--soluk:#8E9BC9;--acik:#DDE3F5;--sari:#F2C230;--kirmizi:#C8202F;--zemin:#0A1230}
html,body{margin:0;height:100%;background:#03050f;font-family:Rubik,sans-serif;overflow:hidden}
body.hepsi{overflow:auto}
button{font:inherit;margin:0;cursor:pointer}
/* ---- seçici (önizlemenin dışı) ---- */
.secici{position:fixed;z-index:100;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:6px;padding:0 12px;background:#000;color:#aab;font-size:13px;box-sizing:border-box}
.secici b{color:#fff;font-weight:600;margin-right:6px}
.secici button{height:30px;min-width:30px;padding:0 9px;border:1px solid #2C3D7A;border-radius:6px;background:#0E1838;color:#DDE3F5}
.secici button[aria-current="true"]{background:var(--sari);color:var(--lac);border-color:var(--sari);font-weight:700}
.secici .ac{margin-left:10px;color:#DDE3F5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.secici a{color:#F2C230}
.kap{position:absolute;top:46px;left:0;right:0;bottom:0;display:grid;place-items:center;overflow:hidden}
.kap .artboard{flex:none}
.izgara{position:relative;margin-top:46px;display:grid;grid-template-columns:repeat(2,720px);gap:34px 20px;padding:20px;justify-content:center}
.izgara figure{margin:0;width:720px}
.izgara figcaption{color:#DDE3F5;font:500 15px Rubik;margin:0 0 6px}
.izgara figcaption b{color:#F2C230}
.izgara .cerceve{width:720px;height:405px;overflow:hidden;position:relative}
.izgara .artboard{transform:scale(.5);transform-origin:0 0;position:absolute;left:0;top:0}

/* ---- çerçeve: 1. madde ---- */
.artboard{width:1440px;height:810px;display:grid;grid-template-columns:184px minmax(0,1fr);grid-template-rows:64px minmax(0,1fr) 48px;background:var(--zemin);font-family:Rubik,sans-serif;overflow:hidden;position:relative}
.serit{grid-row:1/4;grid-column:1;box-sizing:border-box;background:var(--lac);padding:12px;display:flex;flex-direction:column;gap:8px}
.s-tarih{background:var(--kutu);border:1px solid var(--cizgi);border-radius:8px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
.s-tarih span:nth-child(1){font-size:16px;font-weight:600;color:var(--sari)}
.s-tarih span:nth-child(2){font-size:14px;color:var(--acik)}
.s-tarih span:nth-child(3){font-size:28px;font-weight:700;color:#fff;line-height:1.1}
.s-gez{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.s-gez button{height:32px;background:var(--dug);color:var(--acik);border:0;border-radius:6px;font-size:13px}
.s-ilerle{height:44px;background:var(--sari);color:var(--lac);border:0;border-radius:8px;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;transition:opacity .2s}
.s-ilerle:disabled{opacity:.35;cursor:not-allowed}
.s-menu{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.s-menu button{height:38px;border:0;border-radius:6px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;font-size:17px;font-weight:600;text-align:left;background:var(--dug);color:var(--krem)}
.s-menu button span{font-size:13px;color:var(--soluk)}
.s-menu button[aria-current="true"]{background:var(--sari);color:var(--lac)}
.s-menu button[aria-current="true"] span{color:var(--lac)}
.s-menu small{display:block;font-size:11px;font-weight:500;color:#FF8A8A;line-height:1}
.s-haber{margin-top:auto;background:var(--kirmizi);color:#fff;border:0;border-radius:8px;height:46px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .3s,color .3s}
.s-haber i{width:8px;height:8px;border-radius:50%;background:#fff;animation:nabiz 1.6s ease-in-out infinite}
.s-haber.sonuk{background:transparent;color:var(--soluk);box-shadow:inset 0 0 0 1px var(--cizgi)}
.s-haber.sonuk i{display:none}
@keyframes nabiz{50%{opacity:.25}}
.s-ayar{height:34px;background:transparent;color:var(--acik);border:1px solid var(--cizgi);border-radius:6px;font-size:14px}
.baslik{grid-row:1;grid-column:2;background:var(--kirmizi);padding:0 24px;display:flex;align-items:center;gap:16px}
.baslik h1{margin:0;font-size:32px;font-weight:700;color:#fff}
.baslik .b-kulup{font-size:15px;color:#FFE3E3}
.baslik .b-ara{flex:1}
.baslik .b-kayit{font-size:12px;letter-spacing:.1em;color:#FFE3E3}
.baslik .b-dur{height:36px;background:#fff;color:var(--kirmizi);border:0;border-radius:6px;padding:0 18px;font-size:13px;font-weight:700;letter-spacing:.08em}
.alt{grid-row:3;grid-column:2;background:#F6F0E2;color:#3A3A48;padding:0 24px;display:flex;align-items:center;gap:8px;font-size:15px}
.alt strong{font-weight:600}
.alt .a-tus{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:#5A5F73}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;box-sizing:border-box;padding:0 6px;border:1px solid #C9C1AE;border-radius:5px;font:600 12px Rubik;color:#3A3A48;background:#fff}
.alan{grid-row:2;grid-column:2;position:relative;overflow:hidden;min-height:0}

/* ---- sahnenin ortak parçaları ---- */
.masa{position:absolute;inset:0;--yx:50%;--yy:50%;--p:0;--dx:0px;--dy:0px;--rot:0deg;--dsx:0px;--dsy:7px;--dsr:0deg;--kr:14px;transition:background .4s}
.masa.ek-acik{--yx:37%}
.kart-yuva,.deste{position:absolute;left:var(--yx);top:var(--yy);width:var(--ke);height:var(--kb);margin-left:calc(var(--ke) / -2);margin-top:calc(var(--kb) / -2);transition:left .3s ease}
.deste i{position:absolute;inset:0;border-radius:var(--kr);transform:translate(calc(var(--n) * var(--dsx)),calc(var(--n) * var(--dsy))) rotate(calc(var(--n) * var(--dsr)));box-shadow:0 2px 6px rgba(0,0,0,.25)}
.kart{position:absolute;inset:0;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;border-radius:var(--kr);
  transform:translate(var(--dx),var(--dy)) rotate(var(--rot));transition:transform .28s cubic-bezier(.2,.8,.2,1);cursor:grab;touch-action:none;user-select:none}
.masa.tut .kart{transition:none;cursor:grabbing}
.masa.ucus .kart{transition:transform .4s cubic-bezier(.55,0,.9,.45)}
.masa.gelis .kart{animation:gelis .32s cubic-bezier(.2,.8,.2,1)}
@keyframes gelis{from{transform:translate(calc(var(--dsx) * 2),calc(var(--dsy) * 2)) scale(.97);opacity:.6}}
.k-bant{flex:none}
.k-ust{display:flex;align-items:center;gap:12px;flex:none}
.k-kim{display:flex;flex-direction:column;gap:1px;min-width:0}
.k-kim b{font-size:16px;font-weight:600}
.k-kim small{font-size:13px;opacity:.75}
.k-sinif{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.k-gorsel{display:none}
.k-tur{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;flex:none}
.k-govde{flex:1;min-height:0;overflow:hidden}
.k-metin{margin:0}
.k-ekler{display:flex;gap:8px;flex-wrap:wrap;flex:none}
.k-ekler:empty{display:none}
.ek{display:inline-flex;align-items:center;gap:6px;font:500 13px Rubik;border-radius:999px;padding:5px 12px 5px 9px;border:1px solid transparent}
.ek svg{width:15px;height:15px;flex:none}
.k-kunye{font-size:13px;flex:none}
.k-kunye:empty{display:none}
.k-cevap{position:absolute;pointer-events:none;opacity:var(--p);box-sizing:border-box}
.masa.damgali .k-cevap{opacity:0;transition:opacity .1s}
.k-ok::before{content:'→'}
.masa[data-yon="sol"] .k-ok::before{content:'←'}
.masa[data-yon="alt"] .k-ok::before{content:'↓'}
.k-ok{font-style:normal;font-weight:700}
.k-damga{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg) scale(1.7);opacity:0;font:700 32px Rubik;letter-spacing:.08em;text-transform:uppercase;border:4px solid currentColor;border-radius:8px;
  padding:6px 18px;color:#b3262a;white-space:nowrap;pointer-events:none;transition:opacity .12s,transform .22s cubic-bezier(.3,1.6,.5,1)}
.masa.damgali .k-damga{opacity:.9;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}
.k-ipucu,.dc-ipucu{display:flex;gap:10px}
.ip{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;font-family:Rubik}
.ik{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.12);overflow:hidden}
.ik svg{width:18px;height:18px}
.ik.ik-kisi svg{width:30px;height:30px}
.ks{--ks:40px;width:var(--ks);height:var(--ks);flex:none;display:grid;place-items:center;border-radius:8px;overflow:hidden}
.ks svg{width:100%;height:100%;display:block}
.ks-kurum{background:var(--kc);color:#fff;font:700 calc(var(--ks) * .3)/1 Rubik;letter-spacing:.04em}
.ks-kulup{border-radius:0}
.soru,.kaynak-alt,.yuva-arka,.dis-cevap,.yan{display:none}
/* kanal gövdeleri */
.g-antet{font:700 13px Rubik;letter-spacing:.12em;color:#7a2a1d;border-bottom:1px solid rgba(0,0,0,.12);padding-bottom:6px;margin-bottom:10px}
.g-antet small{display:block;font-weight:500;letter-spacing:.04em;color:#6B7085;margin-top:2px;font-size:12px}
.g-rakam{display:inline-flex;align-items:baseline;gap:10px;margin-top:12px;padding:6px 12px;border:1.5px dashed rgba(0,0,0,.25);border-radius:6px;font-size:14px}
.g-rakam b{font-size:22px;font-weight:700}
.g-balon{display:inline-block;max-width:92%;padding:12px 16px;border-radius:4px 16px 16px 16px;background:rgba(47,111,208,.12)}
.g-saat{display:block;font-size:12px;opacity:.6;margin-top:6px}
.g-gazete{font:700 12px Rubik;letter-spacing:.14em;border-bottom:3px double rgba(0,0,0,.35);padding-bottom:4px;margin-bottom:8px}
.g-kupur h3{margin:0 0 6px;font:700 26px/1.15 'IBM Plex Serif',serif}
.g-kupur .k-metin{font-family:'IBM Plex Serif',serif}
.g-skor table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.g-skor td{padding:5px 8px;font-size:16px;border-bottom:1px solid rgba(0,0,0,.08)}
.g-skor td:nth-child(1){text-align:right;width:44%}
.g-skor td:nth-child(2){text-align:center;font-weight:700;width:12%}
.g-skor tr.biz td{font-weight:700;background:rgba(242,194,48,.25)}
.g-skor .k-metin{font-size:15px;margin-bottom:8px}
.g-resmi .g-antet{color:#8C1D2B}
.g-kapi{display:flex;gap:16px;align-items:flex-start}
.g-kapi svg{width:46px;height:46px;flex:none;opacity:.8}
/* oynananlar, masadakiler, ek, geçmiş, boş masa */
.yigin{position:absolute;right:30px;bottom:30px;width:170px;height:108px;cursor:pointer;z-index:3}
.yigin b{position:absolute;inset:0;border-radius:8px;background:#FFFDF7;color:#1B2440;padding:10px 12px;box-sizing:border-box;font:600 13px/1.25 Rubik;
  transform:rotate(calc(var(--n) * -5deg)) translate(calc(var(--n) * -7px),calc(var(--n) * 3px));box-shadow:0 4px 10px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:6px;overflow:hidden}
.yigin b em{font-style:normal;font:700 11px Rubik;color:#b3262a;border:2px solid currentColor;border-radius:4px;padding:1px 6px;align-self:flex-start;transform:rotate(-6deg);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.yigin .yg-et{position:absolute;top:-24px;right:0;font-size:12px;color:var(--soluk);white-space:nowrap}
.masada{position:absolute;left:30px;bottom:30px;display:flex;gap:10px;align-items:flex-end;z-index:3}
.masada .ms-et{position:absolute;top:-24px;left:0;font-size:12px;color:var(--soluk);white-space:nowrap}
.masada button{width:156px;min-height:70px;padding:10px 12px;border:0;border-radius:8px;background:#E8DFC8;color:#1B2440;font:600 13px/1.25 Rubik;text-align:left;transform:rotate(-2deg);box-shadow:0 4px 10px rgba(0,0,0,.35)}
.masada button small{display:block;font:500 11px Rubik;color:#6B7085;margin-top:4px}
.ek-kagit{position:absolute;z-index:6;display:none;width:330px;height:430px;top:50%;margin-top:-215px;left:calc(var(--yx) + var(--ke) / 2 + 30px);box-sizing:border-box;background:#fff;color:#1B2440;border-radius:6px;
  box-shadow:0 18px 40px rgba(0,0,0,.45);padding:18px 20px;font-size:14px;line-height:1.45;transition:left .3s ease;overflow:hidden}
.masa.ek-acik .ek-kagit{display:block;animation:ekGir .25s ease}
@keyframes ekGir{from{transform:translateX(-20px);opacity:0}}
.ekk-ust{display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee;padding-bottom:10px;margin-bottom:12px}
.ekk-ust svg{width:16px;height:16px}
.ekk-ust b{flex:1;font-weight:600}
.ekk-ust button{border:0;background:#F1ECDF;border-radius:6px;width:28px;height:28px;font-size:16px}
.ekk-cizgi{height:9px;border-radius:3px;background:#E9E4D8;margin:9px 0}
.ekk-tablo{width:100%;border-collapse:collapse}
.ekk-tablo td{padding:6px 0;border-bottom:1px solid #f0ece2}
.ekk-tablo td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.ekk-not{font:500 24px/1.25 Caveat,cursive;color:#1d2c6b;background:#FFF7C2;padding:14px;border-radius:4px;transform:rotate(-1deg)}
.ekk-alinti{border-left:3px solid #2F6FD0;padding:6px 12px;background:#F2F5FC;border-radius:0 6px 6px 0}
.gecmis{position:absolute;inset:0;z-index:20;background:rgba(3,6,20,.86);display:none}
.masa.gecmis-acik .gecmis{display:block}
.gecmis .kart-yuva{left:50%}
.gecmis .kart{cursor:default;transform:none;--p:0}
.gecmis .k-damga{opacity:.88;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}
.gecmis nav{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:10px;align-items:center}
.gecmis nav button{height:36px;padding:0 16px;border:1px solid var(--cizgi);border-radius:6px;background:var(--kutu);color:var(--acik)}
.gecmis nav button:disabled{opacity:.35}
.gecmis .gc-et{position:absolute;left:0;right:0;top:20px;text-align:center;color:var(--soluk);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.bos{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:var(--acik);font-size:18px;z-index:2}
.masa.bitti .bos{display:grid}
.masa.bitti .kart-yuva,.masa.bitti .soru,.masa.bitti .kaynak-alt,.masa.bitti .dis-cevap{visibility:hidden}
.bos b{display:block;font-size:26px;color:#fff;margin-bottom:8px}
.dc-ad{font-weight:700}

/* =====================================================================================
   1 · KLASİK KART — kremsi kart, üstte kanal rengi; cevap üstten sarı şerit olarak iner
   ===================================================================================== */
.t1 .masa{--ke:600px;--kb:396px;--dsy:7px}
.t1 .deste i{background:#E7E0CC}
.t1 .kart{background:#FFFDF7;color:#1B2440;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.t1 .k-bant{height:6px;background:var(--kanal)}
.t1 .k-ust{padding:20px 28px 0}
.t1 .k-sinif{color:var(--kanal);border:1.5px solid var(--kanal);border-radius:999px;padding:3px 9px}
.t1 .k-tur{padding:14px 28px 0;color:#6B7085}
.t1 .k-govde{padding:8px 28px 0}
.t1 .k-metin{font-size:21px;font-weight:600;line-height:1.32}
.t1 .k-ekler{padding:10px 28px 0}
.t1 .ek{background:#F3EEE1;color:#1B2440;border-color:#E2DACA}
.t1 .k-kunye{margin:12px 28px 0;padding:10px 0 16px;border-top:1px solid #ECE6D6;color:#5A5F73}
.t1 .k-cevap{left:0;right:0;top:0;padding:14px 28px;background:var(--sari);color:var(--lac);transform:translateY(calc((1 - var(--p)) * -100%));
  display:grid;grid-template-columns:auto 1fr auto;column-gap:12px;align-items:center;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.t1 .k-ok{font-size:24px}
.t1 .k-cevapAd{font-size:24px;font-weight:700}
.t1 .k-cevapNot{grid-column:1/3;font-size:14px}
.t1 .k-ipucu{grid-row:1/3;grid-column:3}

/* =====================================================================================
   2 · SİMGE KARTI — Reigns düzeni: soru üstte sabit, kartta büyük yüz/simge, ad altta
   ===================================================================================== */
.t2 .masa{--ke:360px;--kb:400px;--yy:52%;--kr:22px;--dsy:6px;background:radial-gradient(ellipse at 50% 55%,#1a2a66 0,#0A1230 65%)}
.t2 .soru{display:block;position:absolute;top:24px;left:50%;width:760px;margin-left:-380px;text-align:center;color:var(--krem);font:500 23px/1.35 Rubik}
.t2 .soru small{display:block;font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--sari);margin-bottom:8px}
.t2 .kaynak-alt{display:flex;flex-direction:column;align-items:center;gap:4px;position:absolute;left:var(--yx);transform:translateX(-50%);top:calc(var(--yy) + var(--kb) / 2 + 16px);color:var(--krem);transition:left .3s}
.t2 .kaynak-alt b{font-size:18px;font-weight:600}
.t2 .kaynak-alt small{font-size:13px;color:var(--soluk)}
.t2 .kaynak-alt .ka-ekler{display:flex;gap:8px;margin-top:6px}
.t2 .kaynak-alt .ek{background:var(--dug);color:var(--acik)}
.t2 .deste i{background:repeating-linear-gradient(45deg,#14214F 0 12px,#1a2a5e 12px 24px);border:10px solid #DDD5BF;box-sizing:border-box}
.t2 .kart{background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--kanal) 55%,#fff) 0,var(--kanal) 72%);border:10px solid #F6F1E1;box-shadow:0 22px 44px rgba(0,0,0,.5);color:#fff}
.t2 .k-bant,.t2 .k-ust,.t2 .k-tur,.t2 .k-govde,.t2 .k-kunye,.t2 .k-ekler{display:none}
.t2 .k-gorsel{display:grid;place-items:center;flex:1}
.t2 .k-gorsel .ks{--ks:200px;border-radius:12px;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.t2 .k-cevap{left:0;right:0;top:0;height:44%;background:rgba(10,18,48,.88);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:0 18px}
.t2 .k-ok{display:none}
.t2 .k-cevapAd{font-size:25px;font-weight:700;line-height:1.15}
.t2 .k-cevapNot{font-size:13px;color:var(--acik)}
.t2 .k-ipucu .ik{background:rgba(255,255,255,.14)}
.t2 .k-ipucu .ik svg{color:var(--sari)}

/* =====================================================================================
   3 · MANİLA DOSYA — dosya kartı, daktilo yazı; ekler kenardan sekme; cevap lastik damga
   ===================================================================================== */
.t3 .masa{--ke:620px;--kb:400px;--yy:54%;--kr:4px 10px 10px 10px;--dsx:9px;--dsy:-9px;background:radial-gradient(ellipse at 50% 45%,#2d3d30 0,#121a14 75%)}
.t3 .deste i{background:linear-gradient(#DDBE7C,#CDAE6C)}
.t3 .kart{background:linear-gradient(#EFD49A,#E2C27F);color:#3b2a12;box-shadow:0 14px 30px rgba(0,0,0,.5);font-family:'IBM Plex Mono',monospace;overflow:visible}
.t3 .k-bant{position:absolute;top:-30px;left:0;width:250px;height:31px;background:#EBCE90;border-radius:8px 14px 0 0}
.t3 .k-tur{position:absolute;top:-22px;left:16px;color:#5a4318;letter-spacing:.1em;font-family:'IBM Plex Mono'}
.t3 .k-ust{padding:22px 30px 0}
.t3 .k-kim b{font-weight:600}

    case 'skor':return '<div class="g-skor">'+m+'<table>'+SKOR.map(r=>'<tr'+(r[3]?' class="biz"':'')+'><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join('')+'</table></div>';
    case 'resmi':return '<div class="g-resmi"><div class="g-antet">'+yaz(c.antet)+'<small>'+yaz(c.antetAlt)+'</small></div>'+m+'</div>';
    case 'kapi':return '<div class="g-kapi">'+IKON.kapi+m+'</div>';
  }
  return m;
}

function ekKagit(e,c){
  let g='';
  if(e.tur==='mektup')g='<div class="g-antet">'+yaz(c.antet||kaynakAd(c))+'<small>'+yaz(c.antetAlt||'')+'</small></div><p style="margin:0 0 6px">Sayın Başkan,</p>'+'<div class="ekk-cizgi"></div>'.repeat(3)+'<div class="ekk-cizgi" style="width:70%"></div><p style="margin:12px 0 6px">'+yaz(c.metin)+'</p>'+'<div class="ekk-cizgi"></div>'.repeat(2)+'<div class="ekk-cizgi" style="width:45%"></div><p style="margin-top:18px;font-weight:600">Saygılarımızla</p>';
  else if(e.tur==='tablo')g='<div class="g-antet">MALİ İŞLER MÜDÜRLÜĞÜ<small>Haziran özeti (TEST)</small></div><table class="ekk-tablo"><tr><td>Kasa</td><td>4.100.000 ₺</td></tr><tr><td>Aylık maaş yükü</td><td>473.500 ₺</td></tr><tr><td>Lig payı</td><td>100.000 ₺</td></tr><tr><td>Sponsor (teklif)</td><td>115.000 ₺</td></tr><tr><td>Aylık fark</td><td>−258.500 ₺</td></tr></table><p style="color:#6B7085;font-size:13px;margin-top:12px">Paraf: N.K.</p>';
  else if(e.tur==='liste')g='<div class="g-antet">EKSİK BELGELER<small>KL-2026/114 eki</small></div><p>☐ Stat güvenlik raporu</p><p>☑ Mali tablolar</p><p>☑ Altyapı belgesi</p><p>☑ Sağlık ekibi listesi</p>';
  else if(e.tur==='not')g='<div class="ekk-not">Başkanım, 119 iyi rakam. 125’i zorlarsak kaçar, ben olsam imzalarım. Öğle yemeğine de götürürler bizi.<br>— N.</div>';

  return '<div class="ekk-ust">'+IKON.ek+'<b>'+yaz(e.ad)+'</b><button data-ekkapat title="Kapat (Esc)">×</button></div>'+g;
}
const CERCEVE='<aside class="serit"><div class="s-tarih"><span class="gun">Pazartesi</span><span class="tarih">22.06.2026</span><span>10:00</span></div>'+

  '<main class="alan"><div class="masa" data-yon="">'+
    '<div class="soru"></div><div class="deste"></div>'+

/* ---------- önizleme ---------- */
class Onizleme{
  constructor(kok,tema,o){
    this.kok=kok;this.tema=tema;this.o=o||{};
    kok.className='artboard '+tema;kok.innerHTML=CERCEVE;
    const q=s=>kok.querySelector(s);
    this.masa=q('.masa');this.yer=q('.kart-yer');this.desteEl=q('.deste');this.soruEl=q('.soru');this.kaynakEl=q('.kaynak-alt');this.disEl=q('.dis-cevap');
    this.yaEl=q('.ya-ic');this.yiginEl=q('.yigin');this.masadaEl=q('.masada');this.ekEl=q('.ek-kagit');this.yanEl=q('.yan');this.ilerleEl=q('.s-ilerle');this.haberEl=q('.s-haber');
    this.gcYuva=q('.gecmis .kart-yuva');this.aAlt=q('.a-alt');this.gunEl=q('.s-tarih .gun');this.tarihEl=q('.s-tarih .tarih');
    this.sifirla();if(this.o.kart){this.deste=this.deste.slice(+this.o.kart);this.ciz(false);}this.bagla();
    if(this.o.on)this.onizle(this.o.on);
    if(this.o.ek)this.ekAc(0);
  }
  sifirla(){this.deste=kartlar();this.oynanan=ONCEKI.slice();this.masadaL=[];this.gun=0;this.yon=null;this.p=0;this.kilit=false;this.ekAcik=null;this.ciz(false);}
  get c(){return this.deste[0];}
  ciz(gelis){
    const c=this.c,m=this.masa;
    m.classList.remove('ek-acik','damgali','ucus','gecmis-acik');this.ekAcik=null;
    this.sifirYon();
    m.classList.toggle('bitti',!c);
    this.ilerleEl.disabled=!!c;this.ilerleEl.title=c?'Önce destedeki kartlar':'İlerle';
    this.haberEl.classList.toggle('sonuk',!c);this.haberEl.lastChild.textContent=c?'Haber var':'Haber yok';
    this.desteEl.innerHTML=Array.from({length:Math.max(0,Math.min(6,this.deste.length-1))},(_,i)=>'<i style="--n:'+(i+1)+'"></i>').reverse().join('');
    this.yer.innerHTML=c?kartHtml(c):'';
    this.kart=this.yer.firstChild;
    if(c){
      this.soruEl.innerHTML='<small>'+yaz(c.tur)+'</small>'+yaz(c.soru||c.metin);
      this.kaynakEl.innerHTML='<b>'+yaz(kaynakAd(c))+'</b><small>'+yaz(kaynakRol(c))+' · '+yaz(c.zaman)+'</small>'+(c.ekler&&c.ekler.length?'<span class="ka-ekler">'+ekDugmeleri(c)+'</span>':'');
      m.style.setProperty('--kanal',KANAL[c.kanal]);
      this.aAlt.style.display=c.alt?'':'none';
    }
    this.yiginEl.innerHTML=this.oynanan.length?'<span class="yg-et">Oynananlar</span>'+this.oynanan.slice(0,3).map((x,i)=>'<b style="--n:'+i+'"><span>'+yaz(x.c.tur)+'</span><em>'+yaz(x.c[x.yon].ad)+'</em></b>').reverse().join(''):'';
    this.masadaEl.innerHTML=this.masadaL.length?'<span class="ms-et">Masada · yarın döner</span>'+this.masadaL.map(x=>'<button title="Önizleme: İlerle ile döner"><b>'+yaz(x.tur)+'</b><small>'+yaz(x.alt.ad)+'</small></button>').join(''):'';
    this.yanCiz();
    if(gelis){m.classList.remove('gelis');void m.offsetWidth;m.classList.add('gelis');setTimeout(()=>m.classList.remove('gelis'),340);}
  }
  yanCiz(){
    const c=this.c;
    this.yanEl.innerHTML='<h4>Bu kartın ekleri</h4>'+(c&&c.ekler&&c.ekler.length?c.ekler.map((e,i)=>'<button class="y-ek" data-ek="'+i+'"><span class="y-kagit"></span><span><b>'+yaz(e.ad)+'</b><small>Dokun, kartın yanında açılsın</small></span></button>').join(''):'<p class="y-yok">Bu kartın eki yok.</p>')+
      '<h4>Son oynananlar</h4><div class="y-oyn">'+this.oynanan.slice(0,5).map((x,i)=>'<button data-gcac="'+i+'"><span>'+yaz(x.c.tur)+'</span><em>'+yaz(x.c[x.yon].ad)+'</em></button>').join('')+'</div>';
  }
  sifirYon(){this.yonAyarla(null,0,0,0);}
  yonAyarla(yon,p,dx,dy){
    const m=this.masa;
    m.style.setProperty('--dx',dx+'px');m.style.setProperty('--dy',dy+'px');m.style.setProperty('--rot',(yon==='alt'?0:dx*0.05)+'deg');m.style.setProperty('--p',p.toFixed(3));
    m.dataset.yon=yon||'';
    if(yon!==this.yon){
      const a=yon&&this.c?this.c[yon]:null;
      if(this.kart){
        this.kart.querySelector('.k-cevapAd').textContent=a?a.ad:'';
        this.kart.querySelector('.k-cevapNot').textContent=a?a.not:'';
        this.kart.querySelector('.k-ipucu').innerHTML=a?ipucu(a.ipucu):'';
      }
      this.yaEl.innerHTML=a?'<b>'+yaz(a.ad)+'</b><small>'+yaz(a.not)+'</small><span class="k-ipucu">'+ipucu(a.ipucu)+'</span>':'';
      this.disEl.innerHTML=a?'<i class="k-ok"></i><b class="dc-ad">'+yaz(a.ad)+'</b><span class="dc-not">'+yaz(a.not)+'</span><span class="dc-ipucu">'+ipucu(a.ipucu)+'</span>'
        :'<span class="dc-bos">Kartı sağa ya da sola kaydır: cevabın yüzü burada'+(this.c&&this.c.alt?' · aşağı çek: masaya bırak':'')+'</span>';
    }
    this.yon=yon;this.p=p;
  }
  onizleDx(){return this.tema==='t4'?300:this.tema==='t8'?90:70;}
  onizle(yon){
    if(!this.c||this.kilit)return;
    if(yon==='alt'&&!this.c.alt)return;
    if(yon==='alt')this.yonAyarla('alt',1,0,70);else this.yonAyarla(yon,1,yon==='sag'?this.onizleDx():-this.onizleDx(),0);
  }
  uygula(yon){
    const c=this.c;if(!c||this.kilit)return;const a=c[yon];if(!a)return;
    this.kilit=true;const m=this.masa;
    if(this.yon!==yon)this.onizle(yon);
    this.kart.querySelector('.k-damga').textContent=yon==='alt'?'Masada':a.ad;
    m.classList.add('damgali');
    setTimeout(()=>{m.classList.add('ucus');m.style.setProperty('--dx',(yon==='sag'?1500:yon==='sol'?-1500:0)+'px');m.style.setProperty('--dy',(yon==='alt'?900:60)+'px');m.style.setProperty('--rot',(yon==='sag'?24:yon==='sol'?-24:0)+'deg');},360);
    setTimeout(()=>{
      this.deste.shift();
      if(yon==='alt')this.masadaL.push(c);else this.oynanan.unshift({c,yon});
      if(a.devam)this.deste.unshift(a.devam);
      this.kilit=false;this.ciz(true);
    },780);
  }
  ilerle(){
    if(this.c)return;
    if(this.masadaL.length){
      this.gun++;this.gunEl.textContent='Salı';this.tarihEl.textContent='23.06.2026';
      this.deste=this.masadaL.map(c=>{const d=c.alt.donus||{};const n=Object.assign({},c,d,{zaman:'bugün 09:00'});
        if(d.ekEkle)n.ekler=(c.ekler||[]).concat([d.ekEkle]);if(d.sag)n.sag=d.sag;n.alt=null;return n;});
      this.masadaL=[];this.ciz(true);
    }else this.sifirla();
  }
  ekAc(i){
    const c=this.c;if(!c||!c.ekler||!c.ekler[i])return;
    if(this.ekAcik===i){this.ekKapat();return;}
    this.ekAcik=i;this.ekEl.innerHTML=ekKagit(c.ekler[i],c);this.masa.classList.add('ek-acik');
  }
  ekKapat(){this.ekAcik=null;this.masa.classList.remove('ek-acik');}
  gecmisAc(i){
    if(!this.oynanan.length)return;
    this.gcI=Math.max(0,Math.min(this.oynanan.length-1,i));
    const x=this.oynanan[this.gcI];
    this.gcYuva.innerHTML=kartHtml(x.c);
    const d=this.gcYuva.querySelector('.k-damga');d.textContent=x.c[x.yon].ad;
    this.gcYuva.querySelector('.kart').style.setProperty('--kanal',KANAL[x.c.kanal]);
    this.masa.classList.add('gecmis-acik');
    this.kok.querySelector('[data-gc="-1"]').disabled=this.gcI>=this.oynanan.length-1;
    this.kok.querySelector('[data-gc="1"]').disabled=this.gcI<=0;
  }
  bagla(){
    const k=this.kok,m=this.masa;
    k.addEventListener('click',e=>{
      const t=e.target.closest('[data-ek],[data-ekkapat],[data-gc],[data-gcac],.yigin,.s-ilerle,.masada button');
      if(!t)return;
      if(t.dataset.ekkapat!==undefined)return this.ekKapat();
      if(t.dataset.ek!==undefined){e.stopPropagation();return this.ekAc(+t.dataset.ek);}
      if(t.dataset.gcac!==undefined)return this.gecmisAc(+t.dataset.gcac);
      if(t.dataset.gc!==undefined){const v=+t.dataset.gc;if(!v)return m.classList.remove('gecmis-acik');return this.gecmisAc(this.gcI-v);}
      if(t.classList.contains('yigin'))return this.gecmisAc(0);
      if(t.classList.contains('s-ilerle'))return this.ilerle();
    });
    let bas=null;
    m.addEventListener('pointerdown',e=>{
      if(!this.kart||this.kilit||!e.target.closest('.masa > .kart-yuva')||e.target.closest('[data-ek]'))return;
      bas={x:e.clientX,y:e.clientY,id:e.pointerId,olcek:k.getBoundingClientRect().width/1440};
      m.classList.add('tut');this.kart.setPointerCapture(e.pointerId);
    });
    m.addEventListener('pointermove',e=>{
      if(!bas||e.pointerId!==bas.id)return;
      const dx=(e.clientX-bas.x)/bas.olcek,dy=(e.clientY-bas.y)/bas.olcek,c=this.c;
      if(c.alt&&dy>30&&dy>Math.abs(dx)*1.2)this.yonAyarla('alt',Math.min(1,dy/130),dx*.2,dy);
      else if(Math.abs(dx)>6)this.yonAyarla(dx>0?'sag':'sol',Math.min(1,Math.abs(dx)/140),dx,Math.max(-40,Math.min(40,dy*.25)));
      else this.yonAyarla(null,0,dx,dy*.25);
    });
    const birak=e=>{
      if(!bas||e.pointerId!==bas.id)return;
      bas=null;m.classList.remove('tut');
      if(this.yon&&this.p>=1)this.uygula(this.yon);else this.sifirYon();
    };
    m.addEventListener('pointerup',birak);m.addEventListener('pointercancel',birak);
  }
  tus(e){
    if(this.masa.classList.contains('gecmis-acik')){
      if(e.key==='Escape')this.masa.classList.remove('gecmis-acik');
      if(e.key==='ArrowLeft')this.gecmisAc(this.gcI+1);
      if(e.key==='ArrowRight')this.gecmisAc(this.gcI-1);
      return;
    }
    if(e.key==='ArrowRight')this.onizle('sag');
    else if(e.key==='ArrowLeft')this.onizle('sol');
    else if(e.key==='ArrowDown')this.onizle('alt');
    else if(e.key==='ArrowUp')this.sifirYon();
    else if(e.key==='Enter'){if(this.c&&this.yon&&this.p>=1)this.uygula(this.yon);else if(!this.c)this.ilerle();}
    else if(e.key==='Escape'){if(this.ekAcik!==null)this.ekKapat();else this.sifirYon();}
    else return;
    e.preventDefault();
  }
}

  addEventListener('resize',olcek);olcek();

  addEventListener('keydown',e=>o.tus(e));
  window.ONIZLEME=o;
}
