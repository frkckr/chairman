<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chairman — dosya ve defter (prototip)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Jersey+10&display=swap" rel="stylesheet">
<!-- Yol haritası 2.8M: masada açık dosya ve iki sayfalı defter için görsel taslak. Gerçek kural ve ekran dosyalarını (../js) kullanır;
     oyunun içeriği olmadığı için yalnız denemelerin TEST içeriğini (../araclar/test-icerik.js) yükler. Kariyer yalnız bellekte tutulur.
     Adres parametreleri: ?panel=dosya|ajanda|telefon, ?durum=bos|karar|devir|kabul (TEST konusunun hangi anında açılsın), ?yazi=buyuk, ?test=0. -->
<style>
:root{
  color-scheme:dark;
  --room:#12110f;
  --panel:#1a1917;
  --line:#2e2b26;
  --text:#efe7d6;
  --muted:#9a9282;
  --amber:#ffb530;
  --club:#c8281e;
  --display:"Jersey 10","Arial Narrow",Impact,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--room);color:var(--text)}
body{font-family:var(--mono);font-size:14px;line-height:1.55;padding-inline:16px;padding-block:18px 48px}
.wrap{max-width:1040px;margin-inline:auto;display:grid;gap:18px}
.screen{position:relative;width:100%;max-width:900px;margin-inline:auto;aspect-ratio:4/3;overflow:hidden;background:#000;box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 1px #2e2b26}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 22px}
.grp{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
button{font:inherit;font-size:12.5px;color:var(--text);background:#23211e;border:1px solid #3b372f;border-bottom-width:3px;border-radius:4px;padding:6px 11px 5px;cursor:pointer;line-height:1.2}
button:hover{border-color:#5a5446}
button[aria-pressed="true"]{color:#1a1203;background:var(--amber);border-color:#b9791a}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
/* geliştirici alanı: yalnız deneme ayarları; kapalı başlar, oyuncu alanının parçası değildir */
.gelistirici{max-width:900px;width:100%;margin-inline:auto;border:1px dashed var(--line);border-radius:6px;padding:6px 12px;color:var(--muted);font-size:12px}
.gelistirici summary{cursor:pointer;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.gelistirici[open]{display:grid;gap:10px;padding-bottom:12px}
.gelistirici .satir{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:flex-end}
.gelistirici label{display:flex;flex-direction:column;gap:4px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.gelistirici input[type=range]{width:180px;accent-color:var(--amber)}
.gelistirici output{color:var(--text);font-variant-numeric:tabular-nums}
.gelistirici .bilgi{margin:0;color:var(--muted);font-size:12px}
.nogl{position:absolute;inset:0;display:grid;place-items:center;margin:0;padding:24px;text-align:center;color:var(--muted)}
[hidden]{display:none!important}
/* ---- ortak .oe- bileşenleri: maç programı (js/ekran-mac-oncesi.js, açık tonlar, STIL.program.renk) ve koyu ajanda (STIL.menu) ---- */
.screen{container-type:inline-size}
/* maç programı (2.8E): stat arkada donuk ve hafif karartılmış; önde kâğıt kitapçık. Ölçüler karenin genişliğiyle orantılı (cqw) */
.onEkran{position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding:2.2% 2.6%;overflow:hidden;
  font-family:var(--mono);font-size:1.3cqw;line-height:1.3;color:var(--m-yazi);background:rgba(12,11,10,.45)}
.onEkran small{font-size:.86em}
.prg-kart{width:min(100%,62em);display:grid;gap:.9em;padding:1.1em 1.4em 1em;background:var(--m-zemin);border:1px solid var(--m-cizgi);box-shadow:.35em .45em 0 var(--m-golge)}
.prg-ust{display:flex;justify-content:space-between;align-items:baseline;gap:1em;padding-bottom:.3em;border-bottom:.18em solid var(--m-kulup);color:var(--m-soluk);font-size:.9em;letter-spacing:.12em;text-transform:uppercase}
.prg-ust b{font-family:var(--display);font-weight:400;font-size:1.9em;line-height:.9;letter-spacing:.04em;color:var(--m-kulup)}
.onEkran button{font:inherit;color:var(--m-yazi);background:var(--m-panel);border:1px solid var(--m-cizgi);border-bottom-width:.16em;border-radius:.14em;padding:.3em .9em .22em;cursor:pointer}
.onEkran button:focus-visible{outline:.14em solid var(--m-kulup);outline-offset:.1em}
.prg-karsilasma{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1.2em;padding:.9em 1em;background:var(--m-panel);border:1px solid var(--m-cizgi)}
.prg-takim{display:grid;justify-items:center;gap:.45em;min-width:0;text-align:center}
.prg-takim .oe-arma{width:4.4em;height:5.1em}
.prg-vs{display:grid;justify-items:center;gap:.15em}
.prg-vs b{font-family:var(--display);font-weight:400;font-size:3.6em;line-height:.85;color:var(--m-kulup)}
.prg-vs span{font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.prg-kars{margin-top:.5em;border-collapse:collapse;font-variant-numeric:tabular-nums}
.prg-kars th{padding:.1em .8em;font-weight:400;font-size:.86em;letter-spacing:.08em;text-transform:uppercase;color:var(--m-soluk)}
.prg-kars td{padding:.1em .4em;font-weight:600;text-align:center;min-width:2.6em}
.prg-baglam{margin:0;padding-left:.6em;border-left:.2em solid var(--m-vurguZemin)}
.prg-alt{display:flex;align-items:center;gap:1.2em;padding-top:.6em;border-top:.18em solid var(--m-cizgi)}
.prg-hazirlik{flex:1;display:grid;gap:.25em;min-width:0}
.prg-etiket{font-size:.86em;letter-spacing:.1em;text-transform:uppercase;color:var(--m-soluk)}
.prg-cubuk{height:.8em;background:var(--m-panelUst);border:1px solid var(--m-cizgi);border-radius:.4em;overflow:hidden}
.prg-cubuk i{display:block;height:100%;width:0;background:var(--m-vurguZemin)}
.prg-durum{margin:0;color:var(--m-soluk)}
.prg-hata{color:var(--m-kirmizi)}
.onEkran .oe-tablo tbody tr:nth-child(even) td{background:rgba(40,28,12,.05)}
.onEkran .oe-tablo tbody tr.oe-kulup td{background:color-mix(in srgb,var(--m-kulup) 18%,transparent)}
.onEkran .oe-tablo tbody tr.oe-rakip td{background:color-mix(in srgb,var(--m-rakip) 18%,transparent)}
.onEkran .oe-ad{font-size:2em;white-space:normal}
.oe-ust{display:flex;justify-content:space-between;gap:1em;padding-bottom:.35em;border-bottom:.18em solid var(--m-kulup);color:var(--m-soluk);font-size:.92em;letter-spacing:.12em;text-transform:uppercase}
.oe-ad{font-family:var(--display);font-weight:400;font-size:2.3em;line-height:.9;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oe-arma{width:2.5em;height:2.9em;background:linear-gradient(90deg,var(--a) 0 36%,var(--b) 36% 64%,var(--a) 64%);clip-path:polygon(0 0,100% 0,100% 64%,50% 100%,0 64%)}
.oe-form{display:flex;gap:.2em}
.oe-f{display:inline-grid;place-items:center;width:1.45em;height:1.45em;font-weight:600;font-size:.9em;color:#fff}
.oe-G{background:var(--m-galibiyet)}.oe-B{background:var(--m-beraberlik)}.oe-M{background:var(--m-maglubiyet)}
.oe-kol{display:flex;flex-direction:column;gap:.8em;min-width:0;min-height:0}
.oe-panel{background:var(--m-panel);border:1px solid var(--m-cizgi);min-width:0}
.oe-panel h2{display:flex;justify-content:space-between;align-items:baseline;gap:.6em;margin:0;padding:.18em .55em .05em;background:var(--m-panelUst);border-bottom:1px solid var(--m-cizgi);
  font-family:var(--display);font-weight:400;font-size:1.5em;line-height:1.1;letter-spacing:.05em;color:var(--m-vurgu);text-transform:uppercase}
.oe-panel h2 small{font-family:var(--mono);font-size:.5em;letter-spacing:.1em;color:var(--m-soluk)}
.oe-saha{position:relative;aspect-ratio:68/60;margin:.45em;background:repeating-linear-gradient(180deg,var(--m-cim) 0 12.5%,var(--m-cimAcik) 0 25%)}
.oe-saha svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--m-sahaCizgi);stroke-width:.45;opacity:.6}
.oe-oy{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-38%)}
.oe-oy i{display:grid;place-items:center;width:1.75em;height:1.75em;border-radius:50%;font-style:normal;font-weight:600;font-size:.9em;background:var(--f);color:var(--y);box-shadow:0 0 0 .1em rgba(0,0,0,.55)}
.oe-oy span{font-size:.8em;line-height:1.15;white-space:nowrap;text-shadow:.1em .1em 0 #000,-.05em 0 0 #000}
.oe-k{position:absolute;top:-.3em;left:65%;padding:0 .15em;font-style:normal;font-weight:600;font-size:.62em;line-height:1.2;background:var(--m-vurgu);color:#1a1203}
.oe-s{position:absolute;top:-.1em;right:62%;width:.5em;height:.7em;background:var(--m-sari);box-shadow:0 0 0 .08em rgba(0,0,0,.6)}
.oe-liste{list-style:none;margin:0;padding:.3em .55em .4em;display:grid;gap:.12em}
.oe-liste li{display:grid;align-items:center;gap:.5em;white-space:nowrap}
.oe-liste li>*{overflow:hidden;text-overflow:ellipsis}
.oe-liste b{font-weight:500}
.oe-soluk,.oe-liste small{color:var(--m-soluk)}
.oe-eksik li{grid-template-columns:.9em 1.4em minmax(0,auto) minmax(0,1fr) auto}
.oe-eksik li.oe-sinir{grid-template-columns:.9em auto minmax(0,1fr)}
.oe-eksik li.oe-bos{display:block;color:var(--m-soluk)}
.oe-sakat,.oe-cezali,.oe-sari{display:block;width:.9em;height:.9em}
.oe-sakat{background:linear-gradient(var(--m-kirmizi),var(--m-kirmizi)) center/100% 34% no-repeat,linear-gradient(var(--m-kirmizi),var(--m-kirmizi)) center/34% 100% no-repeat}
.oe-cezali,.oe-sari{width:.66em;margin-inline:.12em;background:var(--m-kirmizi)}
.oe-sari{background:var(--m-sari)}
.oe-son li{grid-template-columns:2.4em 1em minmax(0,1fr) auto auto}
.oe-son .oe-f{width:1.3em;height:1.3em;font-size:.8em}
.oe-tablo{width:calc(100% - .8em);margin:.3em .4em .2em;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.95em}
.oe-tablo th{font-weight:500;color:var(--m-soluk);text-align:right;padding:.1em .3em;border-bottom:1px solid var(--m-cizgi)}
.oe-tablo td{text-align:right;padding:.07em .3em;white-space:nowrap}
.oe-tablo .oe-sol{text-align:left;max-width:11em;overflow:hidden;text-overflow:ellipsis}
.oe-tablo td:first-child{border-left:.3em solid transparent}
.oe-tablo tbody tr:nth-child(even) td{background:rgba(255,255,255,.03)}
.oe-tablo tbody tr.oe-kulup td{background:color-mix(in srgb,var(--m-kulup) 55%,transparent)}
.oe-tablo tbody tr.oe-rakip td{background:color-mix(in srgb,var(--m-rakip) 55%,transparent)}
.oe-tablo td.oe-b-cikma{border-left-color:var(--m-galibiyet)}.oe-tablo td.oe-b-playoff{border-left-color:var(--m-vurgu)}.oe-tablo td.oe-b-dusme{border-left-color:var(--m-kirmizi)}
.oe-lejant{display:flex;gap:1.2em;margin:0;padding:0 .55em .4em;color:var(--m-soluk);font-size:.82em}
.oe-lejant span{display:flex;align-items:center;gap:.4em}
.oe-lejant span::before{content:"";display:block;width:.35em;height:1em}
.oe-lejant .oe-b-cikma::before{background:var(--m-galibiyet)}.oe-lejant .oe-b-playoff::before{background:var(--m-vurgu)}.oe-lejant .oe-b-dusme::before{background:var(--m-kirmizi)}
.oe-aradaki li{grid-template-columns:8.6em minmax(0,1fr) auto minmax(0,1fr)}
.oe-aradaki li b:last-child{text-align:right}
.oe-skor{color:var(--m-vurgu);font-weight:600}
.onEkran .oe-ilerle{margin-left:auto;font-family:var(--display);font-size:2.2em;line-height:1;letter-spacing:.06em;padding:.18em 1.1em .08em;color:#1a1203;background:var(--m-vurguZemin);border:1px solid var(--m-vurgu);border-bottom-width:.16em;border-radius:.1em}
.onEkran .oe-ilerle:disabled{opacity:.45;cursor:not-allowed}
.onEkran .oe-ilerle:hover:not(:disabled){filter:brightness(1.08)}
.onEkran .oe-ilerle:active{transform:translateY(.06em);border-bottom-width:.1em}
.onEkran .oe-ilerle:focus-visible{outline:.1em solid var(--m-yazi);outline-offset:.15em}
/* ---- ajanda ekranı (js/ekran-ajanda.js): bültenle aynı kare, ölçü ve renk düzeni; panel başlıkları .oe-panel'den ---- */
.ajanda{position:absolute;inset:0;z-index:3;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:.7em;padding:1.1em 1.4em;overflow:hidden;
  font-family:var(--mono);font-size:1.2cqw;line-height:1.3;color:var(--m-yazi);background-color:var(--m-ortuRenk);
  background-image:repeating-conic-gradient(#0000 0 25%,rgba(255,255,255,.022) 0 50%);background-size:.4em .4em}
.ajanda button{font:inherit;font-size:1em;line-height:1.2;color:var(--m-yazi);background:var(--m-panelUst);border:1px solid var(--m-cizgi);border-bottom-width:.16em;border-radius:.12em;padding:.3em .7em .22em;cursor:pointer}
.ajanda button:hover:not(:disabled){border-color:var(--m-soluk)}
.ajanda button:disabled{opacity:.45;cursor:not-allowed}
.ajanda button:focus-visible{outline:.12em solid var(--m-vurgu);outline-offset:.1em}
.aj-bas{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:end;gap:1.2em}
.aj-tarih{font-family:var(--display);font-size:3.2em;line-height:.85;letter-spacing:.03em;white-space:nowrap}
.aj-tarih small{font-family:var(--mono);font-size:.28em;letter-spacing:.12em;color:var(--m-soluk);margin-left:.6em}
.aj-saatBuyuk{font-family:var(--display);font-size:3.2em;line-height:.85;color:var(--m-vurgu)}
.aj-mesaj{margin:0;color:var(--m-soluk);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.aj-govde{display:grid;grid-template-columns:1.2fr 1fr;gap:.8em;min-height:0}
.aj-kol{display:flex;flex-direction:column;gap:.8em;min-width:0;min-height:0}
.aj-kol>.oe-panel:last-child{flex:1;min-height:0;overflow:hidden}
.aj-liste{list-style:none;margin:0;padding:.3em .4em;display:grid;gap:.12em}
.aj-satir{display:grid;grid-template-columns:7.2em minmax(0,1fr) auto;align-items:center;gap:.6em;width:100%;text-align:left;white-space:nowrap}
.ajanda button.aj-satir{background:transparent;border-color:transparent;border-bottom-width:1px;padding:.22em .4em}
.ajanda button.aj-satir[aria-pressed="true"]{background:var(--m-panelUst);border-color:var(--m-vurgu)}
.aj-takvim{padding:.12em .4em}
.aj-ad{overflow:hidden;text-overflow:ellipsis}
.aj-saat{color:var(--m-soluk);font-variant-numeric:tabular-nums}
.aj-bitti .aj-ad{color:var(--m-soluk)}
.aj-bos{color:var(--m-soluk);padding:.2em .4em}
.aj-etiket{font-size:.76em;letter-spacing:.08em;text-transform:uppercase;padding:.02em .4em;border:1px solid currentColor}
.aj-zorunlu{color:var(--m-kirmizi)}.aj-ertelenebilir{color:var(--m-vurgu)}.aj-istege{color:var(--m-soluk)}
.aj-durum{font-size:.85em}.aj-d-yapildi{color:var(--m-galibiyet)}.aj-d-kacirildi{color:var(--m-maglubiyet)}.aj-d-ertelendi{color:var(--m-soluk)}
.aj-tutar,.aj-dl dd{font-variant-numeric:tabular-nums}
.aj-eksi{color:var(--m-kirmizi)}
.aj-vurgu{color:var(--m-vurgu);font-weight:600}
.aj-p-ayrinti{flex:1;min-height:0}
.aj-ayrinti{padding:.5em .7em;display:grid;gap:.5em;align-content:start}
.aj-ayrinti p,.aj-bozuk p{margin:0}
.aj-is-baslik b{font-weight:600}
.aj-not,.aj-dipnot{color:var(--m-soluk)}
.aj-dipnot{margin:0;padding:0 .6em .4em;font-size:.82em}
.aj-bilgi b{color:var(--m-vurgu);font-weight:500;margin-right:.4em}
.aj-uyari,.aj-hata{color:var(--m-kirmizi)}
.aj-dugmeler{display:flex;flex-wrap:wrap;gap:.5em;margin-top:.2em}
.aj-secenekler{list-style:none;margin:0;padding:0;display:grid;gap:.35em}
.aj-secenekler li{display:grid;gap:.05em;padding-left:.5em;border-left:.2em solid var(--m-cizgi)}
.aj-secenekler li:has([aria-pressed="true"]){border-left-color:var(--m-vurgu)}
.aj-secenekler small{color:var(--m-soluk);font-size:.9em;line-height:1.25}
.ajanda .aj-secenek{justify-self:start;text-align:left;padding:.15em .6em .1em}
.ajanda .aj-secenek[aria-pressed="true"]{border-color:var(--m-vurgu);color:var(--m-vurgu)}
.ajanda .aj-secenek b{font-weight:600}
.ajanda .aj-birincil{color:#1a1203;background:var(--m-vurgu);border-color:#b9791a}
.aj-dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.12em 1em;margin:0;padding:.35em .6em}
.aj-dl dt{color:var(--m-soluk)}
.aj-dl dd{margin:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aj-dl .oe-form{justify-content:flex-end}
.aj-alt{display:flex;align-items:center;gap:1em;padding-top:.55em;border-top:.18em solid var(--m-cizgi)}
.aj-altDurum{flex:1;min-width:0;margin:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ajanda .aj-kucuk{font-size:.85em;color:var(--m-soluk)}
.ajanda .aj-tehlike{color:var(--m-kirmizi);border-color:var(--m-kirmizi)}
.ajanda .aj-ana{font-family:var(--display);font-size:2.2em;line-height:1;letter-spacing:.06em;padding:.18em 1.1em .08em;color:#1a1203;background:var(--m-vurgu);border-color:#b9791a;white-space:nowrap}
.ajanda .aj-ana:active:not(:disabled){transform:translateY(.06em)}
.aj-mesele{grid-template-columns:10em minmax(0,1fr) auto}
.aj-yeni{color:var(--m-vurgu);border:1px solid currentColor;font-size:.76em;letter-spacing:.08em;text-transform:uppercase;padding:.02em .4em}
.aj-m-kararBekliyor{color:var(--m-kirmizi)}.aj-m-ekipte{color:var(--m-vurgu)}.aj-m-haberBekliyor{color:var(--m-yazi)}.aj-m-kapandi{color:var(--m-galibiyet)}
.ajanda button.aj-baglanti{background:transparent;border:0;border-bottom:1px solid var(--m-soluk);border-radius:0;padding:0;text-align:left;color:var(--m-yazi)}
.aj-olaylar{list-style:none;margin:0;padding:0;display:grid;gap:.2em;font-size:.92em}
.aj-olaylar li{display:grid;grid-template-columns:8.2em minmax(0,1fr);gap:.6em}
.aj-bozuk{grid-row:2/5;display:grid;gap:.8em;align-content:start;max-width:60em;padding:1em 0}
/* ---- oda ekranı (js/ekran-oda.js): açık "kâğıt" arayüz; ölçüler karenin genişliğiyle orantılı (cqw); renkler STIL.kagit'ten ---- */
.oda{position:absolute;inset:0;z-index:3;font-family:var(--mono);font-size:var(--k-yaziBoyu,1.42cqw);line-height:1.35;color:var(--k-yazi)}
.oda button{font:inherit;font-size:1em;line-height:1.2;color:var(--k-yazi);background:var(--k-serit);border:1px solid var(--k-cizgi);border-bottom-width:.16em;border-radius:.14em;padding:.3em .7em .22em;cursor:pointer}
.oda button:hover:not(:disabled){border-color:var(--k-soluk)}
.oda button:disabled{opacity:.5;cursor:not-allowed}
.oda button:focus-visible,.oda input:focus-visible{outline:.14em solid var(--k-kulup);outline-offset:.1em}
.oda button[aria-pressed="true"]{background:var(--k-vurguZemin);border-color:var(--k-vurgu);color:#1a1203}
.oda p{margin:0}

<script>
/* prototip oturumu: bellek deposu, gerçek komut ve kayıt yolu (kayitOturumu) */
const PROTOTIP={oturum:null,ekran:null};
{
  const q=new URLSearchParams(location.search),al=ad=>q.get(ad)||undefined,depo=bellekDeposu();
  const rastgele=()=>Math.floor(Math.random()*0x100000000),dunya=parseInt(al('dunya'),10);
  BASLANGIC_EKLERI.push(k=>testIcerikKur(k));
  const kur=()=>{let k;k=kariyerBaslat({tohum:Number.isFinite(dunya)?dunya:rastgele()});
    /* TEST konusunun istenen anı: karar (Salı 10:30 teklif), devir (sayman üstlendi), kabul (karar verildi) */
    const d=q.get('durum');
    if(d&&d!=='bos'){const s=Object.values(k.isler).find(x=>x.veri.baslik==='Deneme randevusu');ajandaIsiYap(k,s.id);duragaIlerle(k);duragaIlerle(k);
      const ki=Object.values(k.isler).find(x=>x.tur==='ajanda'&&x.veri.karar);
      if(ki&&(d==='devir'||d==='kabul'))ajandaIsiYap(k,ki.id,d==='devir'?'devret':'kabul');}
    PROTOTIP.oturum=kayitOturumu(depo,'oda-deneme',k,false);PROTOTIP.oturum.kaydet();return'Yeni kariyer başladı.';};
  const ilk=kur(),saatYaz=d=>d.tarih?d.tarih.slice(5).split('-').reverse().join('.')+' '+saatYazi(d.dakika):'';
  const oyun={
    get kariyer(){return PROTOTIP.oturum.kariyer;},
    komut:(f,kaydetme)=>PROTOTIP.oturum.uygula(f,kaydetme),
    kayitYazi:()=>'Prototip · kayıt yalnız bellekte · '+saatYaz(PROTOTIP.oturum.durum),
    kayitHata:()=>false,kayitTamam:()=>PROTOTIP.oturum.durum.tamam,yenidenKaydet:()=>PROTOTIP.oturum.kaydet(),
    yeniKariyer:kur,macaGit:()=>{alert('Prototip: burada maç bülteni ve 3B maç günü açılır.');},
    ilkMesaj:ilk,bozukHata:null,bozuguSaklaVeBasla:kur
  };
  const ayarlar={yazi:q.get('yazi')==='buyuk'?'buyuk':'normal',test:q.get('test')!=='0',kaydet(){}};
  PROTOTIP.ekran=odaEkraniKur($('oda'),oyun,ayarlar);
  PROTOTIP.ekran.ciz('.od-ana');
  if(['telefon','ajanda','dosya','ayar'].includes(q.get('panel')))PROTOTIP.ekran.ac(q.get('panel'));
  let son=0;
  const kare=t=>{const dt=Math.min(0.05,Math.max(0,(t-son)/1000));son=t;odaKare(duraklatmaVar()?0:dt);odaCiz();requestAnimationFrame(kare);};
  requestAnimationFrame(t=>{son=t;requestAnimationFrame(kare);});
}
