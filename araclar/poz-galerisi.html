/* ---- zaman çizelgesi: adımlar {ad, sure, ek (eylem alanları), v:[vx,vz] başta hız, fren (m/sn²), her(p,e,t,dt) her kare} ---- */
function cizelge(adimlar){let i=-1,t0=0,e=null;
  return function(p,t,dt){
    while(i<adimlar.length-1&&(i<0||t-t0>=adimlar[i].sure)){if(i>=0)t0+=adimlar[i].sure;i++;const B=adimlar[i];
      e=B.ad?Object.assign({ad:B.ad,t:0,sure:B.sure},B.ek||{}):null;p.eylem=e;if(B.v){p.vx=B.v[0];p.vz=B.v[1];}if(B.bas)B.bas(p,e);}
    const A=adimlar[i];if(e&&i===adimlar.length-1&&t-t0>=A.sure){p.eylem=null;e=null;}
    if(e){e.t=t-t0;if(A.her)A.her(p,e,t-t0,dt);}
    if(A.fren){const s=Math.hypot(p.vx,p.vz),n=Math.max(0,s-A.fren*dt);if(s>0){p.vx*=n/s;p.vz*=n/s;}}};}
/* vuruş evreleri: hazırlık (topa koşu), geri salınım, takip */
function vurusHer(geri){return(p,e,t)=>{if(t<0.25){e.faz='hazirlik';e.ft=t;}else if(t<0.25+geri){e.faz='geri';e.ft=t-0.25;e.geri=geri;}else{e.faz='takip';e.ft=t-0.25-geri;}
  if(e.faz!=='hazirlik'){p.vx*=0.9;p.vz*=0.9;}};}
/* A2b (2026-10-08): motorun vuruş zinciri gibi — oyuncu duran topa v hızıyla koşar; ayak noktası (gövdenin 0,3 m önü) topa 0,5 m'ye girince
   geri salınım (o.geri sn), sonra temas ('takip'; top o.topV hızıyla gider) ve 0,26 sn takip. Top, geri salınım tg sn'de başlayacak yerdedir.
   Satırın kareleri: tg'ye göre (basıştan önce, geri salınım, temas, takip, iniş) */
function vurusSim(o){
  const tg=o.tg||0.7,v=o.v,geri=o.geri||0.11;let e=null,bitti=false;
  return{kur:p=>{e=null;bitti=false;p.vx=v;p.ayak=o.ayak||'sag';if(o.kimlik)Object.assign(p,o.kimlik);const b=mac.ball;b.x=0.8+v*tg;b.z=0;b.y=o.topY||0;},
    her:(p,t,dt)=>{const b=mac.ball;
      if(!e&&!bitti){e={ad:'vurus',faz:'hazirlik',t:0,ft:0,ayak:o.ayak||'sag',stil:o.stil,guc:0,tekDokunus:!!o.tek,geri,
        sec:{tur:o.tur||'pas',tip:o.tip||'yer',hx:b.x+(o.L||12),hz:b.z,yay:o.stil==='asirtma'?'asirtma':undefined}};p.eylem=e;}
      if(e){e.t+=dt;e.ft+=dt;
        if(e.faz==='hazirlik'){p.vx=v;if(b.x-(p.x+0.3)<0.5){e.faz='geri';e.ft=0;}}
        else if(e.faz==='geri'){p.vx=Math.max(0.6*v,p.vx-6*dt);if(e.ft>=geri){e.faz='takip';e.ft=0;e.guc=o.guc;e.stil=o.stil;b.vx=o.topV||14;b.vy=o.topVy||0;b.surum++;}}
        else{p.vx=Math.max(0.5*v,p.vx-4*dt);if(e.ft>=0.26){p.eylem=null;e=null;bitti=true;}}}
      if(b.vx||b.vy){b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy-=9.81*dt;if(b.y<0){b.y=0;b.vy=-b.vy*0.5;}}},
    kareler:(()=>{const tc=tg+geri;return[tg-0.25,tg-0.1,tg+geri*0.5,tc+1/60,tc+0.09,tc+0.2,tc+0.36].map(x=>+x.toFixed(4));})()};}

      her:(p,t)=>{if(t>=9&&!p.__f){p.__f=true;anmKenarOlay('faul',{aleyhe:0,kart:'sari'});}},kareler:[1.0,3.0,5.0,7.0,9.4,10.2,13.0],az:20}],
  /* A2a bekleyiş ve jest katmanı (Ek G0.7–G0.8) */
  a2bekle:[
    {ad:'A2 Bekleyiş: tarz geçişi (belde · gevşek), nefes',kur:p=>{p.kip='dur';p.n=7;},kareler:[1.5,5,9,13,17,21,25],az:30},
    {ad:'A2 Sert koşudan sonra durunca: eller dizlerde soluklanma',kur:p=>{p.vx=7;},her:(p,t)=>{p.vx=t<3?7:Math.max(0,7-(t-3)*9);p.kip=p.vx<0.2?'dur':'kos';},kareler:[2.8,3.6,4.2,5.0,6.0,7.2,8.2],az:75},
    {ad:'A2 Kıpırtı: bakınma ve çorap çekme',kur:(p,a)=>{p.kip='dur';p.n=3;a.kpT=0.5;},kareler:[3.0,3.6,4.2,4.8,5.4,6.0,6.6],az:30},
    {ad:'A2 Jest: kol kaldırma (top isteme / ofsayt)',kur:p=>{p.kip='dur';},her:(p,t)=>{p.jest=t>0.4&&t<2.0?{tur:'kol',t:t-0.4,sure:1.6}:null;},kareler:[0.3,0.5,0.7,1.0,1.4,1.85,2.2],az:30},
    {ad:'A2 Jest: işaret (hedef sağ önde), gövde döner',kur:p=>{p.kip='dur';},her:(p,t)=>{p.jest=t>0.4&&t<2.0?{tur:'isaret',t:t-0.4,sure:1.6,hedef:{x:p.x+5,z:p.z+4}}:null;},kareler:[0.3,0.5,0.7,1.0,1.4,1.85,2.2],az:10},
    {ad:'A2 Jest: itiraz (kollar açık, avuçlar yukarı)',kur:p=>{p.kip='dur';},her:(p,t)=>{p.jest=t>0.4&&t<2.0?{tur:'itiraz',t:t-0.4,sure:1.6}:null;},kareler:[0.3,0.5,0.7,1.0,1.4,1.85,2.2],az:10}]
};
/* sevinç satırı: gol aşaması, golcü ve hız eğrisi (koşar, yavaşlar) */
function sevincKur(S,p,a){mac.phase='goal';mac.phaseT=0;mac.score=[1,0];
  if(S.uzgun){p.team=1;mac.celeb={team:0,scorer:null,own:false};p.vx=1.2;return;}
  const golcu=S.saril?oyuncu({x:2.4,z:0.3,team:0,n:9}):p;mac.celeb={team:0,scorer:golcu,own:false};p.sevinc=true;}
function sevincHer(S,p,t){mac.phaseT=t;if(S.uzgun){p.vx=Math.max(0,1.2-t*0.5);return;}
  if(S.saril){p.vx=t<0.8?2:Math.max(0,2-(t-0.8)*4);return;}
  p.vx=t<1.0?6:Math.max(0,6-(t-1.0)*5);}

/* ---- bir satırı çalıştır: her kare motor adımı gibi (önceki yer → yeni yer), örnek anlarda çağrı ---- */
function satirCalistir(S,ornek,sonT){
  for(const a of AKTOR)a.m.root.visible=false;RAKIP_M.visible=false;
  const p=oyuncu(),kit=KITLER[S.kit||0];mac.ball=Object.assign(mac.ball,{x:6,y:0,z:0,vx:0,vy:0,vz:0,tasiyan:null,sahip:null,sut:null});mac.teams=[[],[]];mac.phase='play';mac.celeb=null;
  mac.players=[];mac.durus=null;
  const a=aktorYeni(kit,p);if(S.kur)S.kur(p,a);if(S.sev!=null||S.uzgun)sevincKur(S,p,a);
  if(S.uzgun)a.uzP=ANM_UZGUN[0];
  const cz=S.adim?cizelge(S.adim):null;let t=0,k=0;const K=S.kareler||[],son=sonT!=null?sonT:(K.length?K[K.length-1]:2)+0.05;
  const kontrol=[];
  while(t<=son){const dt=1/60;
    if(cz)cz(p,t,dt);if(S.her)S.her(p,t,dt);if(S.sev!=null||S.uzgun)sevincHer(S,p,t);
    a.px=p.x;a.pz=p.z;p.x+=p.vx*dt;p.z+=p.vz*dt;p.spd=Math.hypot(p.vx,p.vz);
    zaman+=dt;aktorGuncelle(a,1,dt,TUNEL);
    if(t<dt*1.5&&S.sev!=null){a.sevSon=true;a.sevC=S.sev;a.sevDiz=!!S.diz;}
    if(t<dt*1.5&&S.uzgun)a.uzP=ANM_UZGUN[(AKTOR.length)%2];
    for(const c of ANM_KANAL)if(!Number.isFinite(a.P[c]))kontrol.push(S.ad+' '+c+' t='+t.toFixed(2));
    if(!Number.isFinite(a.m.root.position.y)||!Number.isFinite(a.m.root.quaternion.w))kontrol.push(S.ad+' kök t='+t.toFixed(2));
    while(k<K.length&&t>=K[k]-1e-6){ornek&&ornek(a,p,k,t);k++;}
    t+=dt;}
  a.m.root.visible=false;
  return kontrol;
}
/* ---- çizim: satır etiketleri ve hücreler ---- */
function hucreCiz(a,p,S,x,y,w,h){
  a.m.root.visible=true;a.m.root.updateMatrixWorld(true);
  const hp=new THREE.Vector3();a.m.hip.getWorldPosition(hp);
  const az=(S.az!=null?S.az:30)*D,u=S.uzak||5,hy=S.sabitY?0.95:Math.max(0.55,hp.y)+0.05;   /* sabitY: sıçrama görünsün diye kamera yüksekliği sabit (A2b) */
  camera.position.set(hp.x+Math.cos(az)*u,hy+0.9,hp.z+Math.sin(az)*u);camera.lookAt(hp.x,hy,hp.z);camera.aspect=w/h;camera.updateProjectionMatrix();
  topMesh.position.set(mac.ball.tasiyan?a.m.root.position.x+0.25:mac.ball.x,TOP_R+(mac.ball.tasiyan?1.25:mac.ball.y),mac.ball.tasiyan?a.m.root.position.z:mac.ball.z);
  RAKIP_M.visible=!!(p.eylem&&p.eylem.ad==='omuz'&&p.eylem.rakip)||p.tavir==='koru';
  if(RAKIP_M.visible){const r=p.eylem&&p.eylem.rakip||mac.teams[1][0];RAKIP_M.position.set(p.tavir==='koru'?p.x+r.x:p.x,0.85,p.tavir==='koru'?p.z+r.z:p.z+(r.z<p.z?-0.75:0.75));}
  const yy=H-y-h;renderer.setViewport(x,yy,w,h);renderer.setScissor(x,yy,w,h);renderer.setClearColor(0x1d2621);renderer.clear();renderer.render(scene,camera);
  a.m.root.visible=false;RAKIP_M.visible=false;
}
function yaz(s,x,y,renk,boy){yg.fillStyle=renk||'#e8e2cf';yg.font=(boy||12)+'px monospace';yg.fillText(s,x,y);}
/* ?satir=i&sutun=k: tek satır, k kare (yakından bakmak için) */
const SATIR=new URLSearchParams(location.search).get('satir'),SUTUN=+(new URLSearchParams(location.search).get('sutun')||7);
function sayfaCiz(ad){
  let L=SAYFALAR[ad];if(SATIR!=null){const S=Object.assign({},L[+SATIR]),k=S.kareler;S.kareler=Array.from({length:SUTUN},(_,i)=>k[Math.round(i*(k.length-1)/Math.max(1,SUTUN-1))]);L=[S];}
  const n=L.length,ust=24,etiket=150,K=SATIR!=null?SUTUN:7,cw=Math.floor((W-etiket)/K),rh=Math.min(Math.floor((H-ust)/n),SATIR!=null?Math.round(cw*1.4):9999),hata=[];
  yg.clearRect(0,0,W,H);yaz('Poz galerisi · '+ad+' · sütunlar zaman sırası (sn) · ızgara 0,5 m',8,16,'#f0d080',13);
  L.forEach((S,i)=>{const y=ust+i*rh;
    hata.push(...satirCalistir(S,(a,p,k,t)=>{hucreCiz(a,p,S,etiket+k*cw,y,cw-2,rh-2);yaz(t.toFixed(2)+(p.eylem?' '+p.eylem.ad:''),etiket+k*cw+4,y+rh-6,'#cfe8c0',11);}));
    yg.fillStyle='rgba(0,0,0,0.0)';const kel=S.ad.split(' ');let sat='',yy=y+18;for(const w of kel){if((sat+' '+w).length>18){yaz(sat,6,yy);yy+=15;sat=w;}else sat=sat?sat+' '+w:w;}yaz(sat,6,yy);});
  return hata;
}
/* ---- ölçüm: ayak kayması (yerdeki ayağın yatay yer değiştirmesi, adım başına) ve aktorGuncelle süresi ---- */
function ayakOlc(aciD,v,sure){
  const p=oyuncu(),a=aktorYeni(KITLER[0],p),V=new THREE.Vector3(),A=[new THREE.Vector3(),new THREE.Vector3()],ON=[null,null];
  const yx=Math.cos(aciD*D)*v,yz=Math.sin(aciD*D)*v;mac.ball.x=40;mac.ball.z=0;
  let t=0,yol=0,net=0,adim=0,onceki=-1,bas=null,govde=0,isinma=1.0;
  for(;t<sure;t+=1/60){const dt=1/60;p.vx=yx;p.vz=yz;a.px=p.x;a.pz=p.z;p.x+=yx*dt;p.z+=yz*dt;p.spd=v;zaman+=dt;aktorGuncelle(a,1,dt,TUNEL);
    a.m.root.updateMatrixWorld(true);
    for(let i=0;i<2;i++){A[i].set(0,-0.5,0.05).applyMatrix4((i?a.m.kR:a.m.kL).matrixWorld);}
    const alt=A[0].y<A[1].y?0:1,yer=A[alt].y<0.05?alt:-1;
    if(t>=isinma){if(yer>=0&&yer===onceki&&ON[yer]){yol+=Math.hypot(A[yer].x-ON[yer].x,A[yer].z-ON[yer].z);}
      if(yer>=0&&yer!==onceki){if(bas&&onceki>=0){net+=Math.hypot(ON[onceki].x-bas.x,ON[onceki].z-bas.z);}adim++;bas=A[yer].clone();}
      govde+=v*dt;}
    for(let i=0;i<2;i++)ON[i]=(ON[i]||new THREE.Vector3()).copy(A[i]);onceki=yer;}
  a.m.root.visible=false;
  return{aci:aciD,hiz:v,adim,yolAdim:adim?yol/adim:0,netAdim:adim>1?net/(adim-1):0,adimBoy:adim?govde/adim:0};
}
function sureOlc(){/* 60 aktör, gerçek saat (Date.now), çok kare: aktorGuncelle toplamı (kare başına ms) */
  const L=[];for(let i=0;i<60;i++){const p=oyuncu({n:i,yon:i*0.37}),a=aktorYeni(KITLER[i%3],p);p.vx=Math.cos(i)*(1+i%7);p.vz=Math.sin(i)*(1+i%5);L.push([a,p]);
    if(i%9===0)p.eylem={ad:'yerde',t:0,sure:9};if(i%11===0)p.tavir='jokey';}
  const N=600,t0=Date.now();
  for(let f=0;f<N;f++){zaman+=1/60;for(const [a,p] of L){a.px=p.x;a.pz=p.z;p.x+=p.vx/60;p.z+=p.vz/60;p.spd=Math.hypot(p.vx,p.vz);if(p.eylem)p.eylem.t+=1/60;aktorGuncelle(a,1,1/60,TUNEL);}}
  const ms=(Date.now()-t0)/N;for(const [a] of L)a.m.root.visible=false;return ms;
}
function olcumCiz(){
  yg.clearRect(0,0,W,H);yaz('Ayak kayması: yerdeki ayağın adım başına yatay yolu (m) · yüz +x, hareket açısı derece',8,20,'#f0d080',14);
  const sat=[[0,1.5],[0,4],[0,7],[0,8.3],[45,3],[45,5],[90,1.5],[90,2.8],[-90,2.8],[135,2],[135,3],[180,1.5],[180,3]],R=[];
  sat.forEach(([ac,v],i)=>{const r=ayakOlc(ac,v,4);R.push(r);
    yaz(`açı ${String(ac).padStart(4)}°  hız ${v.toFixed(1)} m/sn  adım ${String(r.adim).padStart(2)}  adım boyu ${r.adimBoy.toFixed(2)} m  kayma/adım: yol ${r.yolAdim.toFixed(3)} m, net ${r.netAdim.toFixed(3)} m`,12,52+i*22,r.yolAdim<=0.08?'#cfe8c0':'#ff9a80',13);});
  const ort=R.reduce((s,r)=>s+r.yolAdim,0)/R.length;
  yaz('ortalama yol/adım: '+ort.toFixed(3)+' m',12,52+sat.length*22+10,'#f0d080',14);
  const ms=sureOlc();yaz('aktorGuncelle: 60 aktör, 600 kare, Date.now: '+ms.toFixed(3)+' ms/kare',12,52+sat.length*22+40,'#f0d080',14);
  window.ANM_OLCUM={ayak:R,ortalama:ort,msKare:ms};
}
/* ---- çalıştır: istenen sayfa çizilir; bütün sayfaların durumları NaN için denetlenir ---- */
let hatalar=[];
if(SAYFA==='olcum')olcumCiz();else if(SAYFALAR[SAYFA])hatalar=sayfaCiz(SAYFA);
for(const ad in SAYFALAR)if(ad!==SAYFA)for(const S of SAYFALAR[ad])hatalar.push(...satirCalistir(S,null));
if(hatalar.length){console.error('Poz galerisi: sayısal olmayan değer: '+hatalar.slice(0,8).join(' | '));}
window.GALERI_TAMAM=true;
