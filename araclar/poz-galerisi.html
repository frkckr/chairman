     pres koşusu ve markajda el teması, yeni sevinçler) |

     a5model (A5, 2026-10-15: kesitli model — kimlikler önden, yandan, arkadan; vuruş, maç sonu hayal kırıklığı, düşüş; yakın ve loca uzaklığı;
     karşılaştırma &model=kutu | duz | yumusak) |

     a8alis (A8, 2026-10-18: yönlü alışta açık beden, uzun topta açma dokunuşu ve hedefe bakış, tabanla durdurma, alçak top sürme dokunuşu, sürüklemede
     uzun itiş ve depar) | a8vurus (A8: yerden ve yükselen sert şut, yarım vole, plase, bel hizasında blok) |
     z2duran (Z2e, 2026-10-19: hakemin spreyi — topun yeri ve barajın çizgisi, köpük ve solması —, 5 sn sayımı, yatan barajcı ve kalkışı, taç markajı, perdesi
     ve alıcının isteği, korner kullananın bakışı ve hedefli kolu, yay koşusunun son 1,5 sn'si; &z2=0 eski çizim) |
     s1serbest (S1a, 2026-10-20: seremonili barajlı serbest vuruş — hakemin "düdüğü bekle" ve "geri it" işaretleri, kalecinin sağa ve sola
     yönlendirmesi, kaostaki barajcı ↔ dizik baraj pozu; &s1=0 eski çizim) |
     s1kart (S1d, 2026-10-20: kart sahnesi — "yerinde kal", çağırma, kaptan işareti (çapraz bilekler, "yaklaşmayın"), ikinci sarı, deftere yazma) |
     s1penalti (S1b, 2026-10-20: penaltı sahnesi — noktayı gösterme (2,4 sn), kaptan işareti, kutuyu boşaltma, kaleciye çizgiyi gösterme) |
     olcum (ayak kayması ve süre ölçümü). Satır seçeneği sabitY: kamera yüksekliği

     Açmak: python3 araclar/kontrol.py "araclar/poz-galerisi.html?sayfa=dusus" (görüntü araclar/son-kontrol-poz-galerisi-sayfa-dusus.png).

const KITLER=[{...STIL.formalar.ev,num:8,skin:STIL.tenler[1],hair:'#241a12',style:'short',h:1,w:1,sekil:sekilKur({ad:'Sekiz',yapi:1,boy:1})},

function oyuncu(ek){return Object.assign({tur:'oyuncu',kind:null,team:0,n:5,no:8,rol:'OS',ayak:'sag',boy:1,x:0,z:0,vx:0,vz:0,spd:0,yon:0,yuk:0,eylem:null,
  sevinc:false,poz:null,oyunda:true,cikiyor:false,oturuyor:false,tavir:null,bakisYon:null,denge:1,enerji:1,sonDokunus:null},ek||{});}
const AKTOR=[];
function aktorYeni(kit,p){const a=aktorKur(kit,p,kit.h);AKTOR.push(a);return a;}

/* ---- zaman çizelgesi: adımlar {ad, sure, ek (eylem alanları), v:[vx,vz] başta hız, fren (m/sn²), her(p,e,t,dt) her kare} ---- */
function cizelge(adimlar){let i=-1,t0=0,e=null;
  return function(p,t,dt){
    while(i<adimlar.length-1&&(i<0||t-t0>=adimlar[i].sure)){if(i>=0)t0+=adimlar[i].sure;i++;const B=adimlar[i];
      e=B.ad?Object.assign({ad:B.ad,t:0,sure:B.sure},B.ek||{}):null;p.eylem=e;if(B.v){p.vx=B.v[0];p.vz=B.v[1];}if(B.bas)B.bas(p,e);}
    const A=adimlar[i];if(e&&i===adimlar.length-1&&t-t0>=A.sure){p.eylem=null;e=null;}
    if(e){e.t=t-t0;if(A.her)A.her(p,e,t-t0,dt);}
    if(A.fren){const s=Math.hypot(p.vx,p.vz),n=Math.max(0,s-A.fren*dt);if(s>0){p.vx*=n/s;p.vz*=n/s;}}};}
/* vuruş evreleri: hazırlık (topa koşu), geri salınım, takip */
function vurusHer(geri){return(p,e,t)=>{if(t<0.25){e.faz='hazirlik';e.ft=t;}else if(t<0.25+geri){e.faz='geri';e.ft=t-0.25;e.geri=geri;}else{e.faz='takip';e.ft=t-0.25-geri;}
  if(e.faz!=='hazirlik'){p.vx*=0.9;p.vz*=0.9;}};}
/* A2b (2026-10-08): motorun vuruş zinciri gibi — oyuncu duran topa v hızıyla koşar; ayak noktası (gövdenin 0,3 m önü) topa 0,5 m'ye girince
   geri salınım (o.geri sn), sonra temas ('takip'; top o.topV hızıyla gider) ve 0,26 sn takip. Top, geri salınım tg sn'de başlayacak yerdedir.
   Satırın kareleri: tg'ye göre (basıştan önce, geri salınım, temas, takip, iniş) */
function vurusSim(o){
  /* T4-V: o.haz asgari hazırlık (karar anından), o.don başlangıç gövde açısı (dönerek vuruş; 7 rad/sn döner), o.tercih tercih edilen ayak (o.ayak vuran
     ayak), o.gucPlan planlanan güç, o.topX topun yeri; eylem alanları kalan/hazirlikEn/hazirlikT/baski/gucPlan motorun sözleşmesindeki gibi */
  const tg=o.tg!=null?o.tg:0.7,v=o.v,geri=o.geri||0.11,haz=o.haz||0,donT=o.don?Math.abs(o.don)/7:0;let e=null,bitti=false;
  return{kur:p=>{e=null;bitti=false;p.vx=v;p.ayak=o.tercih||o.ayak||'sag';if(o.kimlik)Object.assign(p,o.kimlik);const b=mac.ball;b.x=o.topX!=null?o.topX:0.8+v*tg;b.z=0;b.y=o.topY||0;
      if(o.don){p.yon=o.don;p.yonHedef=0;}},
    her:(p,t,dt)=>{const b=mac.ball;
      if(!e&&!bitti){e={ad:'vurus',faz:'hazirlik',t:0,ft:0,ayak:o.ayak||'sag',stil:o.stil,guc:0,tekDokunus:!!o.tek,geri,hazirlikEn:haz,hazirlikT:null,kalan:haz+geri,
        baski:o.baski||0,gucPlan:o.gucPlan!=null?o.gucPlan:0.5,sec:{tur:o.tur||'pas',tip:o.tip||'yer',hx:b.x+(o.L||12),hz:b.z+(o.hzOfs||0),yay:o.stil==='asirtma'?'asirtma':undefined}};p.eylem=e;}
      if(e){e.t+=dt;e.ft+=dt;
        /* A8: hazırlıkta sürüş dokunuşu (o.acmaT sn'de; motorun açma dokunuşu ya da tabanla durdurması gibi): top o.acmaV ile itilir, 2,5 m/sn² ile yavaşlar */
        if(e.faz==='hazirlik'&&o.acmaT!=null){if(!e._acma&&e.t>=o.acmaT){e._acma=true;p.sonDokunus={t,tur:'surus',ayak:o.ayak||'sag',yuzey:o.acmaYuzey||'ic',hareket:o.acmaHareket,donus:!!o.acmaHareket};b.vx=o.acmaV!=null?o.acmaV:2.2;}
          else if(e._acma)b.vx=b.vx>0?Math.max(0,b.vx-2.5*dt):Math.min(0,b.vx+2.5*dt);}
        if(e.faz==='hazirlik'){p.vx=v;const d=b.x-(p.x+0.3);let don=0;
          if(o.don&&Math.abs(p.yon)>0.02){const s=Math.min(Math.abs(p.yon),7*dt);p.yon-=Math.sign(p.yon)*s;don=Math.abs(p.yon)/7;}
          /* kalan: asgari hazırlığın kalanı, ayağa varış ya da dönüş + geri salınım (motorun vurusIlerle hesabı gibi) */
          e.kalan=Math.max(haz-e.t,Math.max(0,d-0.5)/Math.max(0.7,v),don)+geri;
          if(d<0.5&&e.t>=haz&&don<=0){e.faz='geri';e.ft=0;e.hazirlikT=e.t;e.kalan=geri;}}
        else if(e.faz==='geri'){p.vx=Math.max(0.6*v,p.vx-6*dt);e.kalan=Math.max(0,geri-e.ft);
          if(e.ft>=geri){e.faz='takip';e.ft=0;e.kalan=0;e.guc=o.guc;e.stil=o.stil;if(o.kotu){e.kotu=o.kotu;e.kotuU=0.5;}b.vx=o.topV!=null?o.topV:14;b.vy=o.topVy||0;b.surum++;}}
        else{p.vx=Math.max(0.5*v,p.vx-4*dt);if(e.ft>=0.26){p.eylem=null;e=null;bitti=true;}}}
      if(b.vx||b.vy){b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy-=9.81*dt;if(b.y<0){b.y=0;b.vy=-b.vy*0.5;}}},
    kareler:(()=>{const ts=Math.max(tg,haz,donT),tc=ts+geri;return[Math.max(0.02,ts-0.25),Math.max(0.04,ts-0.1),ts+geri*0.5,tc+1/60,tc+0.09,tc+0.2,tc+0.36].map(x=>+x.toFixed(4));})()};}
/* A2b hakem satırı: hakem ya da yan hakem (bayraklı), 0,3 sn'de işaret sırası başlar (js/animasyon.js anmHkIsaret; oyunda motor olayından) */
function bayrakTak(a){const b=new THREE.Mesh(new THREE.PlaneGeometry(0.3,0.22),LAM({color:0xf2c11d,side:THREE.DoubleSide}));b.position.set(0,-0.36,0.14);a.m.eR.add(b);a.bayrak=b;}
function hakemSatir(ad,o){return{ad,kit:3,kur:(p,a)=>{p.tur='hakem';p.kind=o.kind||'ref';p.rol=null;p.team=-1;p.n=o.kind==='lin'?2:1;if(o.kind==='lin')bayrakTak(a);if(o.kur)o.kur(p,a);},
  her:(p,t,dt)=>{if(o.isaret&&!p.__is&&t>=0.3){p.__is=true;anmHkIsaret(p,o.isaret,true);}if(o.her)o.her(p,t,dt);},
  kareler:o.kareler||[0.25,0.42,0.62,0.9,1.25,1.6,2.0],az:o.az!=null?o.az:30,uzak:o.uzak||5};}
/* A2b: rakip vurucu (kaleci set/split-step ve baraj satırları için): 3 m/sn ile x0'dan topa (x 13) koşar; ayak noktası topa 0,5 m'ye girince
   geri salınım (0,17 sn), sonra takip (0,26 sn). Motorun vuruş zinciri gibi; kaleci ve baraj ondan okur */
function rakipVurucu(o){const k={tur:'oyuncu',team:1,oyunda:true,n:9,x:o.x0||16.5,z:0,vx:-3,vz:0,yon:Math.PI,eylem:null};
  return{k,adim:(t,dt)=>{const b=mac.ball;if(t<o.bas){k.eylem=null;return;}
    if(!k.eylem&&!k.bitti){k.eylem={ad:'vurus',faz:'hazirlik',t:0,ft:0,geri:0.17,stil:'ust',guc:1,sec:{tur:o.tur||'sut',hx:-20,hz:0}};}
    const e=k.eylem;if(!e)return;e.t+=dt;e.ft+=dt;
    if(e.faz==='hazirlik'){k.x+=k.vx*dt;if((k.x-0.3)-b.x<0.5){e.faz='geri';e.ft=0;}}
    else if(e.faz==='geri'){if(e.ft>=e.geri){e.faz='takip';e.ft=0;b.vx=-26;b.vy=1.5;}}
    else if(e.ft>=0.26){k.eylem=null;k.bitti=true;}}};}
/* A2b ilk dokunuş satırı: oyuncu 1,5 m/sn ile ilerler, top karşıdan gelir, 0,45 sn'de ayakta (kontrol eylemi; motorda sonDokunus.ayak) */
function dokunusSatir(ad,yuzey,ayak,o){o=o||{};return{ad,kur:p=>{p.vx=1.5;p.ayak=ayak||'sag';const b=mac.ball;b.x=1.03+6*0.45;b.y=o.y||0;b.vx=-6;b.z=ayak==='sol'?-0.12:0.12;},
  adim:[{ad:null,sure:0.45},{ad:o.ad||'kontrol',sure:o.sure||0.22,ek:{yuzey,yon:0},bas:p=>{if(ayak)p.sonDokunus={t:0,tur:'kontrol',ayak,yuzey};const b=mac.ball;b.vx=p.vx;}},{ad:null,sure:1}],
  her:(p,t,dt)=>{const b=mac.ball;b.x+=b.vx*dt;if(t>0.45&&b.y>0)b.y=Math.max(0,b.y-dt*2.2);},kareler:[0.3,0.4,0.46,0.52,0.6,0.75,1.0],az:ayak==='sol'?-60:60};}
/* T4g (2026-10-09): çalım satırı — motorun çalım yürütücüsü gibi (js/mac-hareket.js calimAdim): sürücü v hızla +x yönünde topu 0,45 m önde sürer;
   t0'da hazırlık (p.calim faz 1: hareket, sure, taraf; +1 itiş sağa = +z), aldatmada gövde hazırlığın ilk %55'inde aldatma yanına o.kay m kayar
   ve geri gelir; dur-kalkta top durur; hazırlık bitince itiş (sonDokunus.calim; top itiş yanına o.aci rad, o.vIt m/sn) ve kaçış (faz 2, 0,6 sn) */
function calimSatir(ad,o){const t0=o.t0||0.5,v=o.v||3.5,sure=o.sure,tr=o.taraf||1,aci=(o.aci||0.8)*tr;let C=null,z0=0;
  return{ad,kit:o.kit||0,kur:p=>{p.vx=v;p.ayak=o.ayak||'sag';if(o.n!=null)p.n=o.n;p.calim=null;mac.ball.sahip=p;mac.t=0;C=null;z0=p.z;mac.ball.x=p.x+0.45;mac.ball.z=p.z;},

  for(;t<sure;t+=1/60){const dt=1/60;p.vx=yx;p.vz=yz;a.px=p.x;a.pz=p.z;p.x+=yx*dt;p.z+=yz*dt;p.spd=v;zaman+=dt;aktorGuncelle(a,1,dt,TUNEL);
    a.m.root.updateMatrixWorld(true);
    for(let i=0;i<2;i++){A[i].set(0,-0.5,0.05).applyMatrix4((i?a.m.kR:a.m.kL).matrixWorld);}
    const alt=A[0].y<A[1].y?0:1,yer=A[alt].y<0.05?alt:-1;
    if(t>=isinma){if(yer>=0&&yer===onceki&&ON[yer]){yol+=Math.hypot(A[yer].x-ON[yer].x,A[yer].z-ON[yer].z);}
      if(yer>=0&&yer!==onceki){if(bas&&onceki>=0){net+=Math.hypot(ON[onceki].x-bas.x,ON[onceki].z-bas.z);}adim++;bas=A[yer].clone();}
      govde+=v*dt;}
    for(let i=0;i<2;i++)ON[i]=(ON[i]||new THREE.Vector3()).copy(A[i]);onceki=yer;}
  a.m.root.visible=false;
  return{aci:aciD,hiz:v,adim,yolAdim:adim?yol/adim:0,netAdim:adim>1?net/(adim-1):0,adimBoy:adim?govde/adim:0};
}
function sureOlc(){/* 60 aktör, gerçek saat (Date.now), çok kare: aktorGuncelle toplamı (kare başına ms) */
  const L=[];for(let i=0;i<60;i++){const p=oyuncu({n:i,yon:i*0.37}),a=aktorYeni(KITLER[i%3],p);p.vx=Math.cos(i)*(1+i%7);p.vz=Math.sin(i)*(1+i%5);L.push([a,p]);
    if(i%9===0)p.eylem={ad:'yerde',t:0,sure:9};if(i%11===0)p.tavir='jokey';}
  const N=600,t0=Date.now();
  for(let f=0;f<N;f++){zaman+=1/60;for(const [a,p] of L){a.px=p.x;a.pz=p.z;p.x+=p.vx/60;p.z+=p.vz/60;p.spd=Math.hypot(p.vx,p.vz);if(p.eylem)p.eylem.t+=1/60;aktorGuncelle(a,1,1/60,TUNEL);}}
  const ms=(Date.now()-t0)/N;for(const [a] of L)a.m.root.visible=false;return ms;
}
function olcumCiz(){
  yg.clearRect(0,0,W,H);yaz('Ayak kayması: yerdeki ayağın adım başına yatay yolu (m) · yüz +x, hareket açısı derece',8,20,'#f0d080',14);
  const sat=[[0,1.5],[0,4],[0,7],[0,8.3],[45,3],[45,5],[90,1.5],[90,2.8],[-90,2.8],[135,2],[135,3],[180,1.5],[180,3]],R=[];
  sat.forEach(([ac,v],i)=>{const r=ayakOlc(ac,v,4);R.push(r);
    yaz(`açı ${String(ac).padStart(4)}°  hız ${v.toFixed(1)} m/sn  adım ${String(r.adim).padStart(2)}  adım boyu ${r.adimBoy.toFixed(2)} m  kayma/adım: yol ${r.yolAdim.toFixed(3)} m, net ${r.netAdim.toFixed(3)} m`,12,52+i*22,r.yolAdim<=0.08?'#cfe8c0':'#ff9a80',13);});
  const ort=R.reduce((s,r)=>s+r.yolAdim,0)/R.length;
  yaz('ortalama yol/adım: '+ort.toFixed(3)+' m',12,52+sat.length*22+10,'#f0d080',14);
  const ms=sureOlc();yaz('aktorGuncelle: 60 aktör, 600 kare, Date.now: '+ms.toFixed(3)+' ms/kare',12,52+sat.length*22+40,'#f0d080',14);
  window.ANM_OLCUM={ayak:R,ortalama:ort,msKare:ms};
}
/* ---- çalıştır: istenen sayfa çizilir; bütün sayfaların durumları NaN için denetlenir ---- */
let hatalar=[];
if(SAYFA==='olcum')olcumCiz();else if(SAYFALAR[SAYFA])hatalar=sayfaCiz(SAYFA);
for(const ad in SAYFALAR)if(ad!==SAYFA)for(const S of SAYFALAR[ad])hatalar.push(...satirCalistir(S,null));
if(hatalar.length){console.error('Poz galerisi: sayısal olmayan değer: '+hatalar.slice(0,8).join(' | '));}
/* A4-3: yerden kaldırmanın sayısal denetimi (a4hareket satırı çalıştıysa) */
if(window.A4_KALDIR){const R=window.A4_KALDIR;if(SAYFA==='a4hareket'&&SATIR==null)yaz(`A4-3 kaldırma: kol ağırlığı ≥ 0,98 olan ${R.n} kare · eller arası ort. ${R.elOrt.toFixed(3)} m, en çok ${R.elMax.toFixed(3)} m (≤ 0,15) · gövdeler iç içe en çok ${R.ic.toFixed(3)} m (≤ 0,05)`,8,H-26,'#f0d080',13);yaz(`  en kötü kare: ${R.tani||'—'}`,8,H-8,'#f0d080',13);
  if(R.n&&(R.elMax>0.15||R.ic>0.05))console.error('A4-3 kaldırma kabul dışı: eller '+R.elMax.toFixed(3)+' m, iç içe '+R.ic.toFixed(3)+' m');}
window.GALERI_TAMAM=true;
